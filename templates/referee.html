<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>裁判员工作站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent;}
        /* 控制台特有样式 */
        .console-bg { background-color: #f3f4f6; }
        .input-score { transition: all 0.2s; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 1.2rem; }
        .input-score:focus { transform: scale(1.05); border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); z-index: 10; position: relative; }
        .saving { background-color: #fef3c7 !important; } 
        .saved { background-color: #dcfce7 !important; } 
        .error { background-color: #fee2e2 !important; } 
    </style>
</head>
<body class="bg-green-800 transition-colors duration-500" id="bodyWrap">

    <div id="loginSection" class="h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-96 text-center mx-4">
            <h1 class="text-2xl font-bold mb-6 text-green-800">⏱️ 裁判员登录</h1>
            
            <div class="text-left mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-1">登录名</label>
                <input type="text" id="username" value="referee" placeholder="请输入登录名" class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-green-500 outline-none text-gray-800 font-bold">
            </div>

            <div class="text-left mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-1">密码</label>
                <input type="password" id="pwd" placeholder="请输入裁判密码" class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-green-500 outline-none text-gray-800">
            </div>
            
            <button onclick="login()" id="btnLogin" class="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700 transition active:scale-95 flex justify-center items-center gap-2">
                <span>开始工作</span>
            </button>
        </div>
    </div>

    <div id="mainConsoleSection" class="hidden p-2 md:p-6 pb-20 min-h-screen">
        <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden flex flex-col min-h-[85vh]">
            <div class="bg-blue-600 p-4 text-white flex justify-between items-center shadow-md z-10 relative">
                <h1 class="text-xl font-bold flex items-center gap-2" id="headerTitle">
                    📱 裁判员控制台
                </h1>
                <div class="flex items-center gap-2">
                    <button id="btnBack" onclick="resetRoleSelection()" class="hidden bg-blue-500 hover:bg-blue-400 px-3 py-1.5 rounded text-sm font-bold shadow-sm transition">⬅️ 换身份</button>
                    <button onclick="refreshCurrentView()" class="bg-blue-800 hover:bg-blue-900 px-3 py-1.5 rounded text-sm font-bold shadow-sm transition">🔄 刷新</button>
                </div>
            </div>

            <div id="roleSelection" class="flex-1 flex flex-col justify-center items-center p-6 gap-5 bg-gray-50">
                <div class="text-center mb-2">
                    <h2 class="text-2xl font-black text-gray-800 mb-1">请选择您的裁判岗位</h2>
                    <p class="text-xs text-gray-500">系统将为您切换专属的工作界面</p>
                </div>

                <button onclick="selectRole('checkin')" class="w-full max-w-sm bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-5 rounded-2xl shadow-md hover:shadow-lg active:scale-95 transition transform flex flex-col items-center gap-1.5">
                    <span class="text-3xl">📝</span>
                    <span class="text-lg font-black tracking-widest">检录裁判入口</span>
                    <span class="text-[11px] text-emerald-100 font-medium">按比赛时间顺序进行选手点名</span>
                </button>

                <button onclick="selectRole('starter')" class="w-full max-w-sm bg-gradient-to-r from-amber-500 to-orange-600 text-white p-5 rounded-2xl shadow-md hover:shadow-lg active:scale-95 transition transform flex flex-col items-center gap-1.5 ring-2 ring-orange-400 ring-offset-2">
                    <span class="text-3xl">🚩</span>
                    <span class="text-lg font-black tracking-widest">起点发令裁判入口</span>
                    <span class="text-[11px] text-orange-100 font-medium">核验上道选手，向终点发令推送</span>
                </button>

               <button onclick="selectRole('timing')" class="w-full max-w-sm bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-4 rounded-2xl shadow-md hover:shadow-lg active:scale-95 transition transform flex flex-col items-center gap-1">
                    <span class="text-3xl">⏱️</span>
                    <span class="text-base font-black tracking-widest">终点计时裁判入口 (径赛)</span>
                    <span class="text-[11px] text-blue-100 font-medium">接收发令指令 · 录入跑道径赛成绩</span>
                </button>

                <button onclick="selectRole('field')" class="w-full max-w-sm bg-gradient-to-r from-amber-600 to-orange-600 text-white p-4 rounded-2xl shadow-md hover:shadow-lg active:scale-95 transition transform flex flex-col items-center gap-1">
                    <span class="text-3xl">🎯</span>
                    <span class="text-base font-black tracking-widest">田赛 / 趣味项目裁判入口</span>
                    <span class="text-[11px] text-amber-100 font-medium">跳远/跳高/铅球试跳录入 · 趣味赛结算</span>
                </button>
               </div>

            <div id="checkinSection" class="hidden flex-1 flex flex-col bg-gray-100 p-2 md:p-4">
                <div class="bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl text-emerald-800 text-xs text-center font-bold mb-3 shadow-xs">
                    💡 提示：点击单元内的项目卡片可展开检录名单，勾选标记到位或弃权。
                </div>
                <div id="checkinList" class="flex-1 space-y-4 pb-10"></div>
            </div>
         

             <div id="timingSection" class="hidden flex-1 flex flex-col">
                <div id="trackActiveNotice" class="hidden bg-amber-500 text-white px-4 py-2.5 flex items-center justify-between shadow-md transition-all">
                    <div class="flex items-center gap-2 text-xs md:text-sm font-black animate-pulse">
                        <span class="text-lg">📢</span>
                        <span>跑道当前进行：</span>
                        <span id="activeTrackInfo" class="underline decoration-white underline-offset-4">---</span>
                        <span id="activeTrackTime" class="text-[10px] bg-black/20 px-1.5 py-0.5 rounded font-mono font-normal">00:00:00</span>
                    </div>
                    <button onclick="switchToActiveHeat()" class="bg-white text-amber-800 px-3 py-1 rounded-lg text-xs font-black hover:bg-amber-100 shadow transition active:scale-95">
                        👉 立即载入本科成绩录入
                    </button>
                </div>

                <!-- 🌟 筛选控制栏（终点裁判端会自动隐藏此栏） -->
                <div id="filterSelectBar" class="p-4 bg-gray-50 border-b border-gray-200 grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">1. 选择组别</label>
                        <select id="selGroup" class="w-full border-gray-300 border rounded-md p-2 shadow-sm focus:border-blue-500 font-bold text-gray-700" onchange="onGroupChange()">
                            <option value="">-- 加载中 --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">2. 选择性别</label>
                        <select id="selGender" class="w-full border-gray-300 border rounded-md p-2 shadow-sm focus:border-blue-500 font-bold text-gray-700" disabled onchange="onGenderChange()">
                            <option value="">-- 先选组别 --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">3. 选择项目</label>
                        <select id="selEvent" class="w-full border-gray-300 border rounded-md p-2 shadow-sm focus:border-blue-500 font-bold text-gray-700" disabled onchange="loadAthletes()">
                            <option value="">-- 再选性别 --</option>
                        </select>
                    </div>
                    <div class="flex items-end justify-between md:justify-end md:gap-4 pb-1">
                        <div id="statusTip" class="text-xs font-bold text-blue-600">准备就绪</div>
                    </div>
                </div>

                <div id="fieldControlBar" class="hidden bg-orange-50 border-b border-orange-200 p-3 flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-1 overflow-x-auto no-scrollbar" id="roundPills">
                        <button onclick="switchFieldRound(1)" class="round-pill px-3 py-1 rounded-lg text-xs font-black bg-orange-600 text-white shadow-xs" data-round="1">第1次</button>
                        <button onclick="switchFieldRound(2)" class="round-pill px-3 py-1 rounded-lg text-xs font-bold bg-white text-gray-600 border border-gray-200" data-round="2">第2次</button>
                        <button onclick="switchFieldRound(3)" class="round-pill px-3 py-1 rounded-lg text-xs font-bold bg-white text-gray-600 border border-gray-200" data-round="3">第3次</button>
                        <span class="text-gray-300 text-xs">|</span>
                        <button onclick="switchFieldRound(4)" id="btnRound4" disabled class="round-pill px-3 py-1 rounded-lg text-xs font-bold bg-gray-100 text-gray-400 cursor-not-allowed" data-round="4">第4次</button>
                        <button onclick="switchFieldRound(5)" id="btnRound5" disabled class="round-pill px-3 py-1 rounded-lg text-xs font-bold bg-gray-100 text-gray-400 cursor-not-allowed" data-round="5">第5次</button>
                        <button onclick="switchFieldRound(6)" id="btnRound6" disabled class="round-pill px-3 py-1 rounded-lg text-xs font-bold bg-gray-100 text-gray-400 cursor-not-allowed" data-round="6">第6次</button>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="settleTop8ForFinals()" id="btnSettleTop8" class="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-black shadow transition active:scale-95">
                            ⚡ 截取前8决赛
                        </button>
                        <button onclick="finalizeFieldCompetition()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-black shadow transition active:scale-95">
                            提交最终名次
                        </button>
                    </div>
                </div>

                <div id="highJumpSection" class="hidden flex-1 flex flex-col bg-gray-50 overflow-y-auto relative">
        
                    <div class="bg-white p-2.5 rounded-xl shadow-sm border-b border-gray-200 sticky top-0 z-20 shrink-0">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-xs font-black text-indigo-900 flex items-center gap-1">
                                <span>🚩</span> 当前试跳高度
                            </span>
                            <span id="highJumpAliveStat" class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">
                                正在加载...
                            </span>
                        </div>
                        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5" id="highJumpBarPills">
                        </div>
                    </div>

                    <div class="space-y-2 p-2 flex-1 pb-16" id="highJumpAthletesContainer">
                    </div>
                    <div class="sticky bottom-0 bg-white/95 backdrop-blur border-t border-gray-200 p-2.5 flex items-center justify-between px-4 z-30 shadow-md shrink-0">
                        <div class="text-xs">
                            <span class="text-gray-400">当前升杆：</span>
                            <span id="currentBarText" class="font-black text-indigo-700">1.20m</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="highJumpPassAllUnjumped()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold px-3 py-1.5 rounded-lg active:scale-95 transition">
                                未跳全过(O)
                            </button>
                            <button onclick="highJumpNextBar()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black px-4 py-1.5 rounded-lg shadow active:scale-95 transition">
                                升高下一栏杆 ➔
                            </button>
                        </div>
                    </div>
                </div>

                <div id="normalTableSection" class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-100 text-gray-600 uppercase text-xs sticky top-0 shadow-sm z-10">
                            <tr>
                                <th class="p-3 border-b text-center w-14">序号/道次</th>
                                <th class="p-3 border-b text-center w-16">号码</th>
                                <th class="p-3 border-b">姓名与单位</th>
                                <th class="p-3 border-b text-right w-36">录入成绩</th>
                            </tr>
                        </thead>
                        <tbody id="athleteList" class="divide-y divide-gray-100">
                            <tr><td colspan="4" class="p-10 text-center text-gray-400 font-bold">请选择组别和项目开始录入</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="p-2.5 bg-yellow-50 text-yellow-800 text-xs text-center border-t border-yellow-200 font-bold shrink-0">
                    💡 提示：输入成绩后 <b>点击空白处</b> 即可自动保存。径赛格式如：12.5，田赛如：5.34
                </div>
            </div> 
        </div>
    </div>

<div id="newHeatModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full border-4 border-amber-500 overflow-hidden transform transition-all text-center p-6 space-y-4">
        <div class="text-5xl">🚀</div>
        <div class="space-y-1">
            <span class="bg-amber-100 text-amber-800 text-xs font-black px-3 py-1 rounded-full uppercase tracking-wider">起点已发令</span>
            <h3 class="text-xl font-black text-gray-900 pt-2" id="modalHeatInfo">---</h3>
            <p class="text-xs text-gray-400 font-mono" id="modalHeatTime">--:--:--</p>
        </div>
        <p class="text-xs text-amber-700 font-bold bg-amber-50 p-2.5 rounded-xl">
            ⚡ 请终点裁判准备计时，选手冲线后立即录入！
        </p>
        <button onclick="acceptNewHeatAndLoad()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 text-white py-3 rounded-xl font-black text-base shadow-lg hover:from-amber-600 hover:to-orange-700 active:scale-95 transition">
            👉 立即载入本科成绩录入
        </button>
    </div>
</div><script>
    function login() {
        const user = document.getElementById('username').value.trim();
        const pwd = document.getElementById('pwd').value;
        const btn = document.getElementById('btnLogin');

        if (!user) {
            alert("请输入登录名");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = `<span class="animate-spin">⌛</span> 登录中...`;

        fetch('/api/auth', {
            method: 'POST', 
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ type: 'referee', username: user, password: pwd })
        })
        .then(r => r.json())
        .then(res => {
            if(res.status === 'success') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainConsoleSection').classList.remove('hidden');
                document.getElementById('bodyWrap').classList.remove('bg-green-800');
                document.getElementById('bodyWrap').classList.add('console-bg');

                resetRoleSelection();
                
                initConsoleData();
            } else {
                alert(res.msg || "登录失败，请检查用户名或密码。");
                btn.disabled = false;
                btn.innerHTML = `<span>开始工作</span>`;
            }
        })
        .catch(err => {
            console.error(err);
            alert("网络连接失败，请检查服务器状态。");
            btn.disabled = false;
            btn.innerHTML = `<span>开始工作</span>`;
        });
    }

    document.getElementById('pwd').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') login();
    });
    document.getElementById('username').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') document.getElementById('pwd').focus();
    });

    let metaData = {}; 
    let compStartDate = ""; 
    let currentRole = null;
    let trackPollingTimer = null; 
    let starterPollingTimer = null; 
    let currentActiveHeatData = null; 

    function initConsoleData() {
        fetch('/api/get_competition_date')
            .then(r => r.json())
            .then(d => {
                if (d.success && d.start_date) compStartDate = d.start_date;
            })
            .catch(e => console.log('获取日期失败，将回退为第X天格式'));
    }
function selectRole(role) {
        currentRole = role;
        localStorage.setItem('last_referee_role', role);
        document.getElementById('roleSelection').classList.add('hidden');
        document.getElementById('btnBack').classList.remove('hidden');

        if (trackPollingTimer) clearInterval(trackPollingTimer);
        if (starterPollingTimer) clearInterval(starterPollingTimer);

        if (role === 'starter') {
            document.getElementById('headerTitle').innerHTML = '🚩 起点发令裁判控制台 (径赛)';
            document.getElementById('checkinSection').classList.remove('hidden');
            document.getElementById('timingSection').classList.add('hidden');

            const syncStarterStatus = () => {
                fetch('/api/get_active_heat?_t=' + Date.now())
                    .then(r => r.json())
                    .then(res => {
                        const wasBusy = window.isTrackBusy;
                        window.isTrackBusy = Boolean(res.data && !res.is_finished);
                        if (wasBusy !== window.isTrackBusy) {
                            loadCheckinSchedule();
                        }
                    }).catch(()=>{});
            };
            syncStarterStatus();
            starterPollingTimer = setInterval(syncStarterStatus, 2500);
            loadCheckinSchedule();
        } else if (role === 'checkin') {
            document.getElementById('headerTitle').innerHTML = '📝 检录长终端';
            document.getElementById('checkinSection').classList.remove('hidden');
            document.getElementById('timingSection').classList.add('hidden');
            if (starterPollingTimer) clearInterval(starterPollingTimer);
starterPollingTimer = setInterval(() => {
    // 如果裁判当前正按着屏幕或焦点在输入框/正在点击按钮，跳过本次自动拉取
    if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'BUTTON')) {
        return;
    }
    loadCheckinSchedule(true); // 传入 isSilent 标记
}, 10000);
            loadCheckinSchedule();
        } else if (role === 'timing') {
            document.getElementById('headerTitle').innerHTML = '⏱️ 终点计时终端 (径赛)';
            document.getElementById('timingSection').classList.remove('hidden');
            document.getElementById('checkinSection').classList.add('hidden');
            
            document.getElementById('fieldControlBar')?.classList.add('hidden');
            document.getElementById('highJumpSection')?.classList.add('hidden');
            document.getElementById('normalTableSection')?.classList.remove('hidden');

            const filterBar = document.getElementById('filterSelectBar');
            if (filterBar) filterBar.classList.add('hidden');

            const list = document.getElementById('athleteList');
            if (list) {
                list.innerHTML = '<tr><td colspan="4" class="p-16 text-center text-gray-400 font-bold text-sm">⏳ 跑道空闲，等待起点裁判发令推送...</td></tr>';
            }

            pollActiveHeat();
            trackPollingTimer = setInterval(pollActiveHeat, 2000);
        } else if (role === 'field') {
            document.getElementById('headerTitle').innerHTML = '🎯 田赛 / 趣味项目终端';
            document.getElementById('timingSection').classList.remove('hidden');
            document.getElementById('checkinSection').classList.add('hidden');
            document.getElementById('trackActiveNotice')?.classList.add('hidden');
            
            const list = document.getElementById('athleteList');
            if (list) {
                list.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-gray-400 font-bold">请在上方选择组别、性别和项目开始录入</td></tr>';
            }

            const filterBar = document.getElementById('filterSelectBar');
            if (filterBar) filterBar.classList.remove('hidden');
            fetchMeta();
        }
    }
    function resetRoleSelection() {
        currentRole = null;
        if (trackPollingTimer) clearInterval(trackPollingTimer);
        if (starterPollingTimer) clearInterval(starterPollingTimer);
        document.getElementById('roleSelection').classList.remove('hidden');
        document.getElementById('btnBack').classList.add('hidden');
        document.getElementById('timingSection').classList.add('hidden');
        document.getElementById('checkinSection').classList.add('hidden');
        document.getElementById('trackActiveNotice')?.classList.add('hidden');
        document.getElementById('headerTitle').innerHTML = '📱 裁判员控制台';
    }

    function refreshCurrentView() {
        if (currentRole === 'timing' || currentRole === 'field') {
            const curEvent = document.getElementById('selEvent')?.value;
            const curGroup = document.getElementById('selGroup')?.value;
            
            if (curEvent && curGroup && !curGroup.includes('连接') && !curGroup.includes('选择')) {
                loadAthletes();
            } else {
                fetchMeta();
            }
        } else if (currentRole === 'checkin' || currentRole === 'starter') {
            loadCheckinSchedule();
        }
    }
    function formatRealDate(estTimeStr) {
        if (!compStartDate || !estTimeStr) return estTimeStr;
        const match = estTimeStr.match(/第(\d+)天(上午|下午)?\s*(.*)/);
        if (!match) return estTimeStr;
        
        const dayOffset = parseInt(match[1]) - 1;
        const unit = match[2] || '';
        const timePart = match[3] || '';
        
        let baseDate = new Date(compStartDate);
        if (isNaN(baseDate.getTime())) return estTimeStr; 
        
        baseDate.setDate(baseDate.getDate() + dayOffset);
        const month = baseDate.getMonth() + 1;
        const date = baseDate.getDate();
        
        return `${month}月${date}日 ${unit} ${timePart}`;
    }
    function loadCheckinSchedule() {
        const listDiv = document.getElementById('checkinList');
        if (!listDiv.children || listDiv.children.length === 0) {
            listDiv.innerHTML = '<div class="text-center p-10 text-emerald-600 font-bold animate-pulse">正在从系统拉取全场赛程...</div>';
        }
        fetch('/api/get_data?_t=' + Date.now())
        .then(r => r.json())
        .then(data => {
            if (!data.schedule || data.schedule.length === 0) {
                listDiv.innerHTML = '<div class="text-center p-10 text-gray-500 font-bold">📂 暂无检录数据，请提醒管理员在后台先进行【智能编排】</div>';
                return;
            }

            const units = {}; 
            data.schedule.forEach(item => {
                const timeStr = item.estTime || '';
                const match = timeStr.match(/第(\d+)天(上午|下午)?/);
                const dayNum = match ? parseInt(match[1]) : 1;
                const ampm = match ? match[2] : '上午';
                const unitKey = `${dayNum}_${ampm}`; 

                if (!units[unitKey]) {
                    // 🌟 增加 fun (趣味项目) 独立分类
                    units[unitKey] = { day: dayNum, ampm: ampm, track: {}, field: {}, fun: {} };
                }

                const heatKey = `${item.timeIndex}_${item.groupName}_${item.eventName}_${item.gender}_${item.heat}`;
                
                // 🌟 判定大项类别：优先识别趣味，其次田赛，其余为径赛
                const eName = item.eventName || '';

                                ${Object.keys(unit.fun).sort((a,b) => unit.fun[a].timeIdx - unit.fun[b].timeIdx).map((k, i) => renderHeatCard(unit.fun[k], `fun_${uIdx}_${i}`)).join('')}

    function fetchMeta() {
        const selGroup = document.getElementById('selGroup');
        selGroup.innerHTML = '<option>正在连接服务器...</option>';

        fetch('/api/get_referee_meta?_t=' + Date.now())
            .then(r => {
                if (!r.ok) throw new Error("HTTP error " + r.status);
                return r.json();
            })
            .then(data => {
                metaData = data; 
                const groups = Object.keys(data).sort();
                selGroup.innerHTML = '<option value="">-- 请选择组别 --</option>';
                if (groups.length === 0) {
                    selGroup.innerHTML = '<option value="">(暂无比赛数据)</option>'; return;
                }
                groups.forEach(g => {
                    const opt = document.createElement('option'); opt.value = g; opt.innerText = g; selGroup.appendChild(opt);
                });
                showTip("✅ 连接成功", "text-green-600");
            })
            .catch(err => {
                console.error(err);
                selGroup.innerHTML = '<option value="">连接失败</option>';
                alert("无法连接到服务器。请检查网络。");
            });
    }

    function onGroupChange() {
        const gName = document.getElementById('selGroup').value;
        const selGender = document.getElementById('selGender');
        const selEvent = document.getElementById('selEvent');
        selGender.innerHTML = '<option value="">-- 选择性别 --</option>';
        selEvent.innerHTML = '<option value="">--</option>';
        selEvent.disabled = true;

        if (!gName || !metaData[gName]) { selGender.disabled = true; return; }

        Object.keys(metaData[gName]).sort().forEach(gen => { selGender.innerHTML += `<option value="${gen}">${gen}</option>`; });
        selGender.disabled = false;
    }

    function isFieldOrFunEvent(eName) {
        return eName.includes('跳') || eName.includes('投') || eName.includes('铅球') || 
               eName.includes('实心球') || eName.includes('标枪') || eName.includes('铁饼') || 
               eName.includes('趣味') || eName.includes('沙包') || eName.includes('毽') || eName.includes('绳');
    }

    function onGenderChange() {
        const gName = document.getElementById('selGroup').value;
        const gen = document.getElementById('selGender').value;
        const selEvent = document.getElementById('selEvent');
        selEvent.innerHTML = '<option value="">-- 选择项目 --</option>';
        if (!gen || !metaData[gName] || !metaData[gName][gen]) { 
            selEvent.disabled = true; 
            return; 
        }

        let eventItems = metaData[gName][gen];
        if (currentRole === 'timing') {
            eventItems = eventItems.filter(item => {
                const t = typeof item === 'object' ? item.type : '';
                return t === '径赛';
            });
        } else if (currentRole === 'field') {
            eventItems = eventItems.filter(item => {
                const t = typeof item === 'object' ? item.type : '';
                return t === '田赛' || t === '趣味' || t === '趣味项目';
            });
        }

        if (eventItems.length === 0) {
            selEvent.innerHTML = '<option value="">(该岗位下无匹配项目)</option>';
            selEvent.disabled = true;
            return;
        }

       eventItems.forEach(item => {
            const eName = typeof item === 'object' ? item.name : item;
            const eType = typeof item === 'object' ? item.type : '';
            const opt = document.createElement('option');
            opt.value = eName;
            opt.dataset.type = eType; // 
            opt.innerText = eName;    // 
            selEvent.appendChild(opt);
        });
        selEvent.disabled = false;
    }


    function loadAthletes() {
        const gName = document.getElementById('selGroup')?.value || '';
        const gender = document.getElementById('selGender')?.value || '';
        const eName = document.getElementById('selEvent')?.value || '';

        const list = document.getElementById('athleteList');
        const normalTable = document.getElementById('normalTableSection');
        const highJumpPanel = document.getElementById('highJumpSection');
        const controlBar = document.getElementById('fieldControlBar');

        if (!gName || !gender || !eName) {
            if (list) {
                list.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-gray-400 font-bold">请在上方选择组别、性别和项目开始录入</td></tr>';
            }
            if (highJumpPanel) highJumpPanel.classList.add('hidden');
            if (normalTable) normalTable.classList.remove('hidden');
            if (controlBar) controlBar.classList.add('hidden');
            return;
        }

        if (list) {
            list.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-blue-500 font-bold animate-pulse">正在获取运动员名单...</td></tr>';
        }

        fetch('/api/get_event_start_list?_t=' + Date.now(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                event_name: eName,
                group_name: gName,
                gender: gender
            })
        })
        .then(r => {
            if (!r.ok) throw new Error("网络响应异常");
            return r.json();
        })
        .then(data => {
            const filteredData = Array.isArray(data) ? data : [];

            if (filteredData.length === 0) {
                if (list) {
                    list.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-gray-400 font-bold">未找到【${gName} ${gender}子 ${eName}】的编排名单</td></tr>`;
                }
                if (highJumpPanel) highJumpPanel.classList.add('hidden');
                if (normalTable) normalTable.classList.remove('hidden');
                if (controlBar) controlBar.classList.add('hidden');
                return;
            }

            const isHighJump = eName.includes('跳高') || eName.includes('撑竿跳');
            const isDistanceField = !isHighJump && (
                eName.includes('跳远') || 
                eName.includes('三级跳') || 
                eName.includes('铅球') || 
                eName.includes('实心球') || 
                eName.includes('标枪') || 
                eName.includes('铁饼')
            );

            if (isHighJump) {
                if (normalTable) normalTable.classList.add('hidden');
                if (controlBar) controlBar.classList.add('hidden');
                if (highJumpPanel) highJumpPanel.classList.remove('hidden');

                if (typeof initHighJumpData === 'function') {
                    initHighJumpData(filteredData);
                }
            } else {
                if (highJumpPanel) highJumpPanel.classList.add('hidden');
                if (normalTable) normalTable.classList.remove('hidden');

                if (currentRole === 'field' && isDistanceField) {
                    if (controlBar) controlBar.classList.remove('hidden');
                    initFieldAthletesData(filteredData);
                    renderCurrentFieldList();
                } else {
                    if (controlBar) controlBar.classList.add('hidden');
                    renderNormalTrackList(filteredData);
                }
            }
        })
        .catch(err => {
            console.error("加载名单失败:", err);
            if (list) {
                list.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-red-500 font-bold">加载名单失败，请检查网络或刷新重试</td></tr>';
            }
        });
    }

   function renderCurrentFieldList() {
        const list = document.getElementById('athleteList');
        if (!list) return;
        
        if (!fieldAthletesData || fieldAthletesData.length === 0) {
            list.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-gray-400 font-bold">暂无有效参赛选手</td></tr>';
            return;
        }

        let html = '';
        fieldAthletesData.forEach((p, idx) => {
            if (!p.orderIndex) p.orderIndex = idx + 1;
            html += renderFieldAthleteRow(p, currentFieldRound);
        });
        list.innerHTML = html;
    }

    function renderFieldAthleteRow(p, roundIndex) {
        const attempts = p.attempts || ['', '', '', '', '', ''];
        const validScores = attempts.map(v => parseFloat(v) || 0);
        const bestScore = Math.max(0, ...validScores);

        return `
        <tr class="border-b border-gray-100 bg-white hover:bg-orange-50/30 transition">
            <td class="p-2.5 text-center font-bold text-gray-400 border-r w-10">${p.orderIndex || p.lane || '-'}</td>
            <td class="p-2.5 text-center font-mono font-bold text-orange-600 text-sm border-r w-14">${p.bib || '---'}</td>
            <td class="p-2.5">
                <div class="font-black text-gray-800 text-[13px] flex items-center gap-1">
                    <span>${p.name}</span>
                    ${p.isFinalist ? '<span class="text-[9px] bg-amber-100 text-amber-800 border border-amber-300 px-1 rounded font-bold">前8强</span>' : ''}
                </div>
                <div class="text-[10px] text-gray-400 truncate max-w-[110px]">${p.team_name}</div>

                <div class="flex items-center gap-1 mt-1 text-[10px] font-mono">
                    ${attempts.map((att, idx) => `
                        <span class="px-1 rounded border ${idx + 1 === roundIndex ? 'bg-orange-600 text-white border-orange-600 font-bold' : (att ? 'bg-gray-100 text-gray-700' : 'text-gray-300')}">
                            ${att || '-'}
                        </span>
                    `).join('')}
                </div>
            </td>

            <td class="p-2 text-right w-36">
                <div class="flex items-center justify-end gap-1">
                    <input type="text" inputmode="decimal" value="${attempts[roundIndex - 1] || ''}" 
                           placeholder="第${roundIndex}次"
                           class="input-score w-20 border border-orange-300 bg-orange-50/50 rounded-lg px-2 py-1.5 text-center font-mono font-bold text-orange-950 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-orange-400"
                           onblur="saveFieldScore(${p.reg_id}, ${roundIndex}, this)">
                    
                    <div class="text-[10px] text-gray-400 text-right min-w-[35px]">
                        <span class="block text-[8px] text-gray-300">最好</span>
                        <span class="font-bold text-orange-700 font-mono">${bestScore > 0 ? bestScore.toFixed(2) : '--'}</span>
                    </div>
                </div>
            </td>
        </tr>
        `;
    }

    function renderNormalTrackList(filteredData) {
        const list = document.getElementById('athleteList');
        let html = ''; let lastHeat = null; 

        filteredData.forEach(p => {
            const currentHeat = p.heat || '1'; 
            let isFirstOfHeat = false;
            if (currentHeat !== lastHeat) {
                html += `
                <tr class="bg-blue-50 heat-row" id="heat_header_${currentHeat}">
                    <td colspan="4" class="p-2.5 pl-4 text-sm font-black text-blue-800 border-y border-blue-200 flex justify-between items-center">

                        <span class="text-xs text-blue-600 font-normal heat-status-tag"></span>
                    </td>
                </tr>`;
                lastHeat = currentHeat;
                isFirstOfHeat = true;
            }

            const checkState = parseInt(p.checked_in !== undefined ? p.checked_in : (p.checkedIn !== undefined ? p.checkedIn : (p.checked || 0)));

function setCheckinStatus(startId, targetStatus) {
    const row = document.getElementById(`checkin_row_${startId}`);
    if (!row) return;

    const btnPresent = row.querySelector('.btn-present');
    const btnAbsent = row.querySelector('.btn-absent');
    const nameSpan = row.querySelector('.ath-name');
    const tagAbsent = row.querySelector('.tag-absent');
    fetch('/api/toggle_checkin', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id: startId, checked_in: targetStatus })
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === 'success') {
            const state = parseInt(res.checked_in !== undefined ? res.checked_in : targetStatus);
            const isPresent = (state === 1);
            const isAbsent = (state === 2);

            row.classList.remove('bg-emerald-50/50', 'bg-red-50/40');
            if (isPresent) row.classList.add('bg-emerald-50/50');
            if (isAbsent) row.classList.add('bg-red-50/40');
            if (nameSpan) {
                if (isAbsent) nameSpan.classList.add('line-through', 'text-gray-400');
                else nameSpan.classList.remove('line-through', 'text-gray-400');
            }
            if (tagAbsent) {
                if (isAbsent) tagAbsent.classList.remove('hidden');
                else tagAbsent.classList.add('hidden');
            }
            if (btnPresent) {
                if (isPresent) {
                    btnPresent.className = 'btn-present w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base transition bg-emerald-600 text-white border-emerald-600 shadow-sm';
                    btnPresent.setAttribute('onclick', `setCheckinStatus(${startId}, 0)`);

                    btnPresent.className = 'btn-present w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base transition bg-white text-gray-300 border-gray-300 hover:border-emerald-500';
                    btnPresent.setAttribute('onclick', `setCheckinStatus(${startId}, 1)`);
                }
            }

            if (btnAbsent) {
                if (isAbsent) {
                    btnAbsent.className = 'btn-absent w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base transition bg-red-600 text-white border-red-600 shadow-sm';
                    btnAbsent.setAttribute('onclick', `setCheckinStatus(${startId}, 0)`);

                    btnAbsent.setAttribute('onclick', `setCheckinStatus(${startId}, 2)`);

    let lastNotifiedHeatKey = null;

    function playStartBeep() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            
            const playTone = (freq, start, duration) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, start);
                gain.gain.setValueAtTime(0.3, start);
                gain.gain.exponentialRampToValueAtTime(0.01, start + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(start);
                osc.stop(start + duration);
            };

            const now = ctx.currentTime;
            playTone(880, now, 0.15);         // 高音 A5
            playTone(1320, now + 0.18, 0.3);  // 超高音 E6
        } catch (e) {
            console.log("音频播放被拦截或不支持", e);
        }
    }

let currentFieldRound = 1;

function initFieldAthletesData(data) {
        fieldAthletesData = data.map((p, idx) => {

           if (p.attempts_json) {
                try {
                    parsedAttempts = JSON.parse(p.attempts_json);

                parsedAttempts = p.attempts;

            }

        });
        currentFieldRound = 1;
   
        document.querySelectorAll('.round-pill').forEach(btn => {

    window.switchFieldRound = function(roundNum) {
        currentFieldRound = roundNum;
        document.querySelectorAll('.round-pill').forEach(btn => {
            if (parseInt(btn.dataset.round) === roundNum) {
                btn.className = "round-pill px-3 py-1 rounded-lg text-xs font-black bg-orange-600 text-white shadow-xs";

    window.settleTop8ForFinals = function() {
        fieldAthletesData.forEach(p => {
            let s1 = parseFloat(p.attempts[0]) || 0;
            let s2 = parseFloat(p.attempts[1]) || 0;
            let s3 = parseFloat(p.attempts[2]) || 0;
            p.prelimBest = Math.max(s1, s2, s3);
        });
        let ranked = [...fieldAthletesData].filter(p => p.prelimBest > 0);
        ranked.sort((a, b) => b.prelimBest - a.prelimBest);

        if (ranked.length === 0) {
            alert("前3次尚未录入任何有效成绩，无法截取！");
            return;
        }

        let top8 = ranked.slice(0, 8);

        top8.reverse(); 
        top8.forEach((p, idx) => {
            p.isFinalist = true;
            p.orderIndex = idx + 1; 
        });

        [4, 5, 6].forEach(r => {
            let btn = document.getElementById(`btnRound${r}`);
            btn.disabled = false;
            btn.className = "round-pill px-3 py-1 rounded-lg text-xs font-bold bg-white text-gray-600 border border-gray-200";
        });

        fieldAthletesData = top8;
        switchFieldRound(4);

        alert(`🎉 阶段结算完成！\n已成功锁定前 ${top8.length} 名选手晋级决赛。\n出场次序已自动按规程【倒序】重排，现已进入第4次试跳！`);
    };

    window.saveFieldScore = function(regId, roundNum, input) {
        let val = input.value.trim().replace('：', '.').replace(':', '.');
        
        let athlete = fieldAthletesData.find(a => a.reg_id === regId || a.id === regId);
        if (athlete) {
            athlete.attempts[roundNum - 1] = val;
            let allValid = athlete.attempts.map(v => parseFloat(v) || 0);
            let overallBest = Math.max(0, ...allValid);
            let scoreStr = overallBest > 0 ? overallBest.toFixed(2) : '';
            let targetRegId = athlete.reg_id || athlete.id;
            if (!targetRegId) {
                console.error("未找到有效的注册ID (reg_id)", athlete);
                alert("保存失败：当前选手的成绩绑定ID丢失，请刷新重试！");
                return;
            }

            input.classList.add('saving');
           
            fetch('/api/submit_score', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    id: targetRegId, 
                    score: String(scoreStr),
                    attempts: JSON.stringify(athlete.attempts)
                })
            })
            .then(r => r.json())
            .then(res => {
                input.classList.remove('saving');
                if (res.status === 'success') {
                    input.classList.add('saved');
                    setTimeout(() => input.classList.remove('saved'), 1000);
                    renderCurrentFieldList(); 
                } else {
                    input.classList.add('error');

                }
            })
            .catch(() => {
                input.classList.remove('saving');
                input.classList.add('error');
            });
        }
    };

            const isCur = (idx === curHjIndex);
            return `
                <button onclick="switchHjHeight(${idx})" 
                        class="px-3 py-1.5 rounded-lg text-xs font-black shrink-0 transition ${isCur ? 'bg-indigo-600 text-white shadow-md scale-105' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">

                +加高

        `;
        container.innerHTML = html;
        document.getElementById('currentBarText').innerText = hjHeights[curHjIndex] + 'm';

    function switchHjHeight(idx) {
        curHjIndex = idx;

        renderHighJumpAthletes();

    function addCustomHjHeight() {
        const val = prompt("请输入要添加的新高度 (如 1.42):");
        if (val && !isNaN(parseFloat(val))) {
            const formatted = parseFloat(val).toFixed(2);
            if (!hjHeights.includes(formatted)) {
                hjHeights.push(formatted);
                hjHeights.sort((a, b) => parseFloat(a) - parseFloat(b));
                curHjIndex = hjHeights.indexOf(formatted);
                renderHighJumpHeightPills();
                renderHighJumpAthletes();
            }
        }
    }

            return `

                <div>
                    <div class="flex items-center gap-1.5">
                        <span class="font-mono text-xs font-bold text-indigo-600">${ath.bib ? '#' + ath.bib : '--'}</span>
                        <span class="font-black text-sm text-gray-800 ${ath.eliminated ? 'line-through text-gray-400' : ''}">${ath.name}</span>
                        ${ath.eliminated ? '<span class="text-[9px] bg-red-100 text-red-600 px-1 rounded font-bold">淘汰</span>' : ''}

                        最好成绩: <span class="font-mono font-black text-indigo-700">${ath.bestHeight ? ath.bestHeight + 'm' : '--'}</span>
                    </div>
                </div>

                <div class="flex items-center gap-1.5">
                    ${[0, 1, 2].map(attIdx => {
                        const val = attempts[attIdx] || '';
                        let btnStyle = "bg-gray-100 text-gray-300 border-gray-200";
                        if (val === 'O') btnStyle = "bg-emerald-600 text-white font-black shadow-xs";
                        else if (val === 'X') btnStyle = "bg-red-100 text-red-700 font-black border border-red-200";
                        else if (val === '-') btnStyle = "bg-gray-200 text-gray-600 font-black";

                        const isDisabled = ath.eliminated || (isPassed && val !== 'O');

                        return `
                            <button onclick="cycleHjAttempt('${ath.id || ath.reg_id}', '${curH}', ${attIdx})" 
                                    ${isDisabled ? 'disabled' : ''}
                                    class="w-9 h-9 rounded-lg text-sm flex items-center justify-center transition active:scale-95 ${btnStyle} ${isDisabled ? 'cursor-not-allowed' : ''}">
                                ${val || '+'}
                            </button>
                        `;
                    }).join('')}
                </div>
            </div>`;
        }).join('');

        container.innerHTML = html;
        document.getElementById('highJumpAliveStat').innerText = `在场: ${aliveCount}人 / 淘汰: ${hjAthletes.length - aliveCount}人`;
    }
    function cycleHjAttempt(athId, height, attIdx) {
        const ath = hjAthletes.find(a => String(a.id || a.reg_id) === String(athId));
        if (!ath) return;

        if (!ath.records[height]) ath.records[height] = [];
        const currentVal = ath.records[height][attIdx] || '';
        let nextVal = 'X';
        if (currentVal === '') nextVal = 'X';
        else if (currentVal === 'X') nextVal = 'O';
        else if (currentVal === 'O') nextVal = '-';
        else if (currentVal === '-') nextVal = '';

        ath.records[height][attIdx] = nextVal;

        if (nextVal === 'O') {
            ath.bestHeight = height;
            saveHjScoreToBackend(ath, height);
        }

        renderHighJumpAthletes();
    }

    function highJumpPassAllUnjumped() {
        const curH = hjHeights[curHjIndex];
        hjAthletes.forEach(ath => {
            if (!ath.eliminated && (!ath.records[curH] || ath.records[curH].length === 0)) {
                ath.records[curH] = ['O'];
                ath.bestHeight = curH;
                saveHjScoreToBackend(ath, curH);
            }
        });
        renderHighJumpAthletes();
    }

    function highJumpNextBar() {
        if (curHjIndex < hjHeights.length - 1) {
            switchHjHeight(curHjIndex + 1);
        } else {
            addCustomHjHeight();
        }
    }

    function saveHjScoreToBackend(ath, score) {
        const targetId = ath.reg_id || ath.id;
        fetch('/api/submit_score', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                id: targetId, 
                score: String(score),
                attempts: JSON.stringify(ath.records) 
            })
        });
    }
// 🌟 页面加载时自动检查是否已经登录过
document.addEventListener("DOMContentLoaded", function() {
    fetch('/api/check_session?_t=' + Date.now())
        .then(r => r.json())
        .then(res => {
            // 如果后端确认当前已是裁判或管理员登录状态
            if (res.status === 'success' && (res.role === 'referee' || res.role === 'admin')) {
                // 1. 自动隐藏登录框，展开控制台
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainConsoleSection').classList.remove('hidden');
                document.getElementById('bodyWrap').classList.remove('bg-green-800');
                document.getElementById('bodyWrap').classList.add('console-bg');

                // 2. 尝试读取裁判之前停留的岗位（检录、发令、终点或田赛）
                const savedRole = localStorage.getItem('last_referee_role') || 'checkin';
                
                initConsoleData();
                selectRole(savedRole); // 自动进入上次所在的岗位界面
            }
        })
        .catch(err => console.log("检查登录态异常:", err));
});
// 🌟 裁判手机端极速录入与震动反馈增强
document.addEventListener('DOMContentLoaded', function() {
    const listContainer = document.getElementById('athleteList');
    if (!listContainer) return;

    // 监听按键：回车键（或手机输入法上的“前往/下一项/Done”）直接保存并跳入下一道
    listContainer.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
            e.preventDefault();
            const currentInput = e.target;
            if (!currentInput.classList.contains('input-score')) return;

            // 1. 立即触发失焦保存
            currentInput.blur();

            // 2. 找到当前同组的下一个道次输入框
            const allInputs = Array.from(listContainer.querySelectorAll('.input-score:not([disabled])'));
            const currentIndex = allInputs.indexOf(currentInput);

            if (currentIndex >= 0 && currentIndex < allInputs.length - 1) {
                const nextInput = allInputs[currentIndex + 1];
                nextInput.focus();
                nextInput.select();
                // 平滑滚动居中，防止被手机软键盘挡住
                nextInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    });
});

// 🌟 升级原版的 saveScore 函数，保存成功时触发手机硬件短震动
const rawSaveScore = window.saveScore;
window.saveScore = function(regId, input) {
    const val = input.value.trim();
    if (!val) return;

    input.classList.add('saving');
    fetch('/api/submit_score', {
        method: 'POST', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify({ id: regId, score: val }) 
    })
    .then(r => r.json())
    .then(res => {
        input.classList.remove('saving');
        if (res.status === 'success') {
            input.classList.add('saved');
            input.classList.remove('bg-yellow-50', 'border-yellow-300');
            if (res.new_score) { input.value = res.new_score; }
            
            // 📳 手机触觉震动反馈（50毫秒清脆短震），在强光下无需看屏幕也知道已存入服务器
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
            
            setTimeout(() => input.classList.remove('saved'), 1000);
        } else {
            input.classList.add('error');
            alert("保存失败：" + res.msg);
            setTimeout(() => input.classList.remove('error'), 2000);
        }
    }).catch(err => {
        input.classList.remove('saving');
        input.classList.add('error');
    });
};

    window.cycleHjAttempt = cycleHjAttempt;
    window.switchHjHeight = switchHjHeight;
    window.addCustomHjHeight = addCustomHjHeight;
    window.highJumpPassAllUnjumped = highJumpPassAllUnjumped;
    window.highJumpNextBar = highJumpNextBar;
</script>
