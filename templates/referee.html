<script>
const socket = io();

// 3. 监听检录状态打钩事件（加入防抖，避免高频并发重绘）
let checkinDebounceTimer = null;
socket.on('checkin_updated', function(payload) {
    if (currentRole === 'starter' || currentRole === 'checkin') {
        if (payload && payload.id && document.getElementById(`checkin_row_${payload.id}`)) {
            const row = document.getElementById(`checkin_row_${payload.id}`);
            const btnPresent = row.querySelector('.btn-present');
            const btnAbsent = row.querySelector('.btn-absent');
            const nameSpan = row.querySelector('.ath-name');
            const tagAbsent = row.querySelector('.tag-absent');
            const s = payload.status;

            row.classList.remove('bg-emerald-50', 'bg-red-50');
            if (nameSpan) nameSpan.classList.remove('line-through', 'text-gray-400');
            if (tagAbsent) tagAbsent.classList.add('hidden');

            if (s === 1) {
                row.classList.add('bg-emerald-50');
                if (btnPresent) {
                    btnPresent.className = "btn-present w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base bg-emerald-600 text-white border-emerald-600 shadow-sm";
                    btnPresent.setAttribute('onclick', `setCheckinStatus(${payload.id}, 0)`);
                }
                if (btnAbsent) {
                    btnAbsent.className = "btn-absent w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base bg-white text-gray-300 border-gray-300";
                    btnAbsent.setAttribute('onclick', `setCheckinStatus(${payload.id}, 2)`);
                }
            } else if (s === 2) {
                row.classList.add('bg-red-50');
                if (nameSpan) nameSpan.classList.add('line-through', 'text-gray-400');
                if (tagAbsent) tagAbsent.classList.remove('hidden');
                if (btnPresent) {
                    btnPresent.className = "btn-present w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base bg-white text-gray-300 border-gray-300";
                    btnPresent.setAttribute('onclick', `setCheckinStatus(${payload.id}, 1)`);
                }
                if (btnAbsent) {
                    btnAbsent.className = "btn-absent w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base bg-red-600 text-white border-red-600 shadow-sm";
                    btnAbsent.setAttribute('onclick', `setCheckinStatus(${payload.id}, 0)`);
                }
            } else {
                if (btnPresent) {
                    btnPresent.className = "btn-present w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base bg-white text-gray-300 border-gray-300";
                    btnPresent.setAttribute('onclick', `setCheckinStatus(${payload.id}, 1)`);
                }
                if (btnAbsent) {
                    btnAbsent.className = "btn-absent w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base bg-white text-gray-300 border-gray-300";
                    btnAbsent.setAttribute('onclick', `setCheckinStatus(${payload.id}, 2)`);
                }
            }
            updateHeatCardCheckinProgress(row);
            return;
        }

        clearTimeout(checkinDebounceTimer);
        checkinDebounceTimer = setTimeout(() => {
            loadCheckinSchedule();
        }, 1500);
    }
});

// 监听后台晋级新赛程/决赛名单发布
socket.on('meta_updated', function() {
    if (currentRole === 'checkin' || currentRole === 'starter') {
        loadCheckinSchedule();
    } else if (currentRole === 'timing') {
        fetchMeta();
    }
});

// 监听专属决赛自动晋级生成事件
socket.on('finals_promoted', function(payload) {
    if (currentRole === 'checkin' || currentRole === 'starter') {
        loadCheckinSchedule();
    } else if (currentRole === 'timing') {
        fetchMeta();
        const curEvt = document.getElementById('selEvent')?.value || '';
        if (payload && (curEvt.includes(payload.clean_core) || curEvt.includes(payload.event_name))) {
            loadAthletes();
        }
    }
});

// 🌟 监听跑道释放事件
socket.on('track_released', function(payload) {
    window.isTrackBusy = false;
    currentActiveHeatData = null;
    
    if (currentRole === 'starter' || currentRole === 'checkin') {
        setTimeout(() => {
            loadCheckinSchedule();
        }, 200);
    } else if (currentRole === 'timing') {
        const notice = document.getElementById('trackActiveNotice');
        const modal = document.getElementById('newHeatModal');
        if (notice) notice.classList.add('hidden');
        if (modal) modal.classList.add('hidden');
    }
});

// 监听成绩更新事件
let scoreUpdatedTimer = null;
socket.on('score_updated', function(payload) {
    if (currentRole === 'starter' || currentRole === 'checkin') {
        if (payload && (payload.heat_completed === true || payload.auto_finals_promoted === true)) {
            window.isTrackBusy = false;
        }
        clearTimeout(scoreUpdatedTimer);
        scoreUpdatedTimer = setTimeout(() => {
            loadCheckinSchedule();
        }, 1500);
    } else if (currentRole === 'timing') {
        const curEvt = document.getElementById('selEvent')?.value || '';
        if (payload && (payload.force_sync || payload.auto_finals_promoted || curEvt.includes(payload.event_name))) {
            loadAthletes();
        }
    }
});
socket.on('referee_score_saved', function(payload) {
    if (currentRole === 'starter') {
        loadCheckinSchedule();
    }
});
function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('pwd').value;
    const btn = document.getElementById('btnLogin');

    if (!username) {
        alert("请输入登录名");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span class="animate-spin">⌛</span> 登录中...`;

    fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'referee', username: username, password: password })
    })
    .then(r => r.json())
    .then(res => {
        btn.disabled = false;
        btn.innerHTML = `<span>开始工作</span>`;
        if (res.status === 'success') {
            if (res.roles) {
                localStorage.setItem('my_referee_roles', JSON.stringify(res.roles));
            }
            if (res.referee_name) {
                localStorage.setItem('my_referee_name', res.referee_name);
            }

            // 切换视觉状态
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainConsoleSection').classList.remove('hidden');
            document.getElementById('bodyWrap').classList.remove('bg-green-800');
            document.getElementById('bodyWrap').classList.add('console-bg');

            initConsoleData();
            showRoleSelection();
        } else {
            alert('登录失败: ' + res.msg);
        }
    })
    .catch(() => {
        btn.disabled = false;
        btn.innerHTML = `<span>开始工作</span>`;
        alert("网络请求失败，请检查服务连接！");
    });
}
document.getElementById('pwd').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') login();
});
document.getElementById('username').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') document.getElementById('pwd').focus();
});

let metaData = {}; 
let compStartDate = ""; 
let currentRole = null;
let currentActiveHeatData = null; 

function initConsoleData() {
    fetch('/api/get_competition_date')
        .then(r => r.json())
        .then(d => {
            if (d.success && d.start_date) compStartDate = d.start_date;
        })
        .catch(e => console.log('获取日期失败，将回退为第X天格式'));
}
// 🌟 裁判员专属登出清理函数
window.logoutReferee = function() {
    if (!confirm("确定要退出当前裁判员账号吗？")) return;

    // 1. 彻底清除前端保存的该裁判权限、姓名与旧角色缓存
    localStorage.removeItem('my_referee_roles');
    localStorage.removeItem('my_referee_name');
    localStorage.removeItem('last_referee_role');

    // 2. 调接口注销服务端 Session 并安全跳转回登录页
    fetch('/api/logout?from=referee')
        .then(() => {
            window.location.href = '/referee/login?_t=' + Date.now();
        })
        .catch(() => {
            window.location.href = '/referee/login?_t=' + Date.now();
        });
};
// 🌟 裁判岗位权限前端显隐控制函数
function filterRoleButtonsByPermission() {
    const rolesJson = localStorage.getItem('my_referee_roles');
    if (!rolesJson) return; // 若无缓存配置则默认全部可见或由全局处理
    
    let myRoles = [];
    try {
        myRoles = JSON.parse(rolesJson);
    } catch(e) {
        return;
    }

    // 对应 5 个裁判岗位的按钮选择器
    const btnMap = {
        'checkin': document.querySelector("button[onclick=\"selectRole('checkin')\"]"),
        'starter': document.querySelector("button[onclick=\"selectRole('starter')\"]"),
        'timing': document.querySelector("button[onclick=\"selectRole('timing')\"]"),
        'field': document.querySelector("button[onclick=\"selectRole('field')\"]"),
        'fun': document.querySelector("button[onclick=\"selectRole('fun')\"]")
    };

    Object.keys(btnMap).forEach(key => {
        const btn = btnMap[key];
        if (btn) {
            // 如果后端下发的权限列表中包含该岗位，则显示；不包含则直接隐藏
            if (myRoles.includes(key)) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        }
    });
}
function showRoleSelection() {
    document.getElementById('loginSection')?.classList.add('hidden');
    document.getElementById('roleSelection')?.classList.remove('hidden');
    document.getElementById('workspace')?.classList.add('hidden');
    
    // 🌟 每次回到角色选择界面时，重新执行权限显隐检查
    filterRoleButtonsByPermission();
}
// ==================== 修改后 ====================
function selectRole(role) {
    currentRole = role;
    localStorage.setItem('last_referee_role', role);
    document.getElementById('roleSelection').classList.add('hidden');
    document.getElementById('btnBack').classList.remove('hidden');

    // 删除了报错的 if (trackPollingTimer) 与 if (starterPollingTimer)
    document.getElementById('checkinSection')?.classList.add('hidden');
    document.getElementById('timingSection')?.classList.add('hidden');

    if (role === 'starter') {
        document.getElementById('headerTitle').innerHTML = '🚩 起点发令端';
        document.getElementById('checkinSection').classList.remove('hidden');

        fetch('/api/get_active_heat?_t=' + Date.now())
            .then(r => r.json())
            .then(res => {
                window.isTrackBusy = Boolean(res.data && !res.is_finished);
                loadCheckinSchedule();
            }).catch(()=>{ loadCheckinSchedule(); });

    } else if (role === 'checkin') {
        document.getElementById('headerTitle').innerHTML = '📝 检录长终端';
        document.getElementById('checkinSection').classList.remove('hidden');
        loadCheckinSchedule();

    } else if (role === 'timing') {
        document.getElementById('headerTitle').innerHTML = '⏱️ 终点记录终端';
        document.getElementById('timingSection').classList.remove('hidden');
        document.getElementById('fieldControlBar')?.classList.add('hidden');
        document.getElementById('highJumpSection')?.classList.add('hidden');
        document.getElementById('normalTableSection')?.classList.remove('hidden');
        document.getElementById('filterSelectBar')?.classList.remove('hidden');
        fetchMeta();
        pollActiveHeat();

    } else if (role === 'field') {
        document.getElementById('headerTitle').innerHTML = '🎯 田赛裁判端';
        document.getElementById('timingSection').classList.remove('hidden');
        document.getElementById('trackActiveNotice')?.classList.add('hidden');
        
        const list = document.getElementById('athleteList');
        if (list) {
            list.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-gray-400 font-bold">请在上方选择组别、性别和项目开始录入</td></tr>';
        }
        document.getElementById('filterSelectBar')?.classList.remove('hidden');
        fetchMeta();
    } else if (role === 'fun') {
        document.getElementById('headerTitle').innerHTML = '🎈 趣味与健康测试端';
        document.getElementById('timingSection').classList.remove('hidden');
        document.getElementById('trackActiveNotice')?.classList.add('hidden');
        document.getElementById('fieldControlBar')?.classList.add('hidden');
        document.getElementById('highJumpSection')?.classList.add('hidden');
        document.getElementById('normalTableSection')?.classList.remove('hidden');
        document.getElementById('filterSelectBar')?.classList.remove('hidden');
        fetchMeta();
    }
}

function resetRoleSelection() {
    currentRole = null;
    document.getElementById('timingSection')?.classList.add('hidden');
    document.getElementById('checkinSection')?.classList.add('hidden');
    document.getElementById('trackActiveNotice')?.classList.add('hidden');
    document.getElementById('roleSelection').classList.remove('hidden');
    document.getElementById('btnBack').classList.add('hidden');
    document.getElementById('headerTitle').innerHTML = '📱 裁判员控制台';
    filterRoleButtonsByPermission();
}
function refreshCurrentView() {
    if (currentRole === 'timing' || currentRole === 'field') {
        if (currentRole === 'timing') pollActiveHeat(); // 👈 点击刷新时立即同步最新发令状态！
        const curEvent = document.getElementById('selEvent')?.value;
        const curGroup = document.getElementById('selGroup')?.value;
        if (curEvent && curGroup && !curGroup.includes('连接') && !curGroup.includes('选择')) {
            loadAthletes();
        } else {
            fetchMeta();
        }
    } else if (currentRole === 'checkin' || currentRole === 'starter') {
        loadCheckinSchedule();
    }
}
function formatRealDate(estTimeStr) {
    if (!compStartDate || !estTimeStr) return estTimeStr;
    const match = estTimeStr.match(/第(\d+)天(上午|下午)?\s*(.*)/);
    if (!match) return estTimeStr;
    
    const dayOffset = parseInt(match[1]) - 1;
    const unit = match[2] || '';
    const timePart = match[3] || '';
    let baseDate = new Date(compStartDate);
    if (isNaN(baseDate.getTime())) return estTimeStr; 
    baseDate.setDate(baseDate.getDate() + dayOffset);
    return `${baseDate.getMonth() + 1}月${baseDate.getDate()}日 ${unit} ${timePart}`;
}

window.expandedUnits = new Set();
window.userManuallyToggledUnits = false;

window.toggleUnitSection = function(unitKey, contentId, arrowId) {
    const content = document.getElementById(contentId);
    const arrow = document.getElementById(arrowId);
    if (!content) return;
    
    window.userManuallyToggledUnits = true;
    if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        if (arrow) arrow.innerText = '▲ 收起单元';
        window.expandedUnits.add(unitKey);
    } else {
        content.classList.add('hidden');
        if (arrow) arrow.innerText = '▼ 展开单元';
        window.expandedUnits.delete(unitKey);
    }
};

function loadCheckinSchedule() {
    const listDiv = document.getElementById('checkinList');
    if (!listDiv.children || listDiv.children.length === 0) {
        listDiv.innerHTML = '<div class="text-center p-10 text-emerald-600 font-bold animate-pulse">正在从系统拉取全场赛程...</div>';
    }
    fetch('/api/get_data?_t=' + Date.now())
    .then(r => r.json())
    .then(data => {
        if (!data.schedule || data.schedule.length === 0) {
            listDiv.innerHTML = '<div class="text-center p-10 text-gray-500 font-bold">📂 暂无检录数据，请提醒管理员在后台先进行【智能编排】</div>';
            return;
        }

        const units = {}; 
        data.schedule.forEach(item => {
            const eName = item.eventName || '';
            const isFunOrHealth = item.is_fun === '1' || item.isFun === true || item.type === 'fun' || 
                                  ['趣味', '健康', '足球', '篮球', '投篮', '蛙跳', '跳绳', '拔河', '毛毛虫', '沙包', '毽'].some(k => eName.includes(k));
            
            // 🌟 趣味项目与健康测试免检录：直接跳过不排入检录列表
            if (isFunOrHealth) {
                return;
            }

            const timeStr = item.estTime || '';
            const match = timeStr.match(/第(\d+)天(上午|下午)?/);
            const dayNum = match ? parseInt(match[1]) : 1;
            const ampm = match ? match[2] : '上午';
            const unitKey = `${dayNum}_${ampm}`; 

            // 🌟 修复：补全 fun: {} 阻止后续的 TypeError
            if (!units[unitKey]) {
                units[unitKey] = { day: dayNum, ampm: ampm, track: {}, field: {}, fun: {} };
            }

            const heatKey = `${item.timeIndex}_${item.groupName}_${item.eventName}_${item.gender}_${item.heat}`;
            const category = item.isField ? 'field' : 'track';

            if (!units[unitKey][category][heatKey]) {
                units[unitKey][category][heatKey] = {
                    timeStr: timeStr, timeIdx: item.timeIndex, groupName: item.groupName, 
                    eventName: item.eventName, gender: item.gender, heat: item.heat, 
                    isField: item.isField, category: category, athletes: []
                };
            }
            units[unitKey][category][heatKey].athletes.push(item);
        });

        if (!window.expandedHeatCards) window.expandedHeatCards = new Set();

        window.toggleHeatCard = function(cardKey, elemId) {
            const el = document.getElementById(elemId);
            if (!el) return;
            el.classList.toggle('hidden');
            if (!el.classList.contains('hidden')) window.expandedHeatCards.add(cardKey);
            else window.expandedHeatCards.delete(cardKey);
        };

        // 🌟 把 getCheckedState 提取到公共位置，让两者都能调用
        const getCheckedState = (p) => {
            if (p.checkedIn !== undefined && p.checkedIn !== null) return parseInt(p.checkedIn);
            if (p.checked_in !== undefined && p.checked_in !== null) return parseInt(p.checked_in);
            return 0;
        };

        function renderAthletesTable(group, typeColor) {
            return `
            <table class="w-full text-center text-sm border-collapse">
                <thead class="bg-gray-50 text-gray-500 text-[11px] border-b">
                    <tr>
                        <th class="py-2.5 px-1 w-10 border-r">道次</th>
                        <th class="py-2.5 px-1 w-12 border-r">号码</th>
                        <th class="py-2.5 px-2 text-left">姓名与单位</th>
                        <th class="py-2.5 px-1 w-16 text-center text-emerald-700">到位</th>
                        <th class="py-2.5 px-1 w-16 text-center text-red-600">弃权</th>
                    </tr>
                </thead>
                <tbody>
                   ${group.athletes.map(p => {
                        const state = getCheckedState(p);
                        const isPresent = (state === 1);
                        const isAbsent = (state === 2);
                        const rowBg = isPresent ? 'bg-emerald-50/50' : (isAbsent ? 'bg-red-50/40' : '');

                        return `
                        <tr id="checkin_row_${p.id}" class="border-b border-gray-100 hover:bg-gray-50 transition ${rowBg}">
                            <td class="py-2.5 font-black text-gray-400 border-r">${p.lane || '-'}</td>
                            <td class="py-2.5 font-mono font-black text-${typeColor}-600 border-r text-[12px]">${p.bib || '---'}</td>
                            <td class="py-2.5 text-left px-2">
                                <div class="font-black text-gray-800 text-[13px] flex items-center gap-1">
                                    <span class="ath-name ${isAbsent ? 'line-through text-gray-400' : ''}">${p.name}</span>
                                    <span class="tag-absent text-[10px] bg-red-100 text-red-700 px-1 py-0.2 rounded font-bold ${isAbsent ? '' : 'hidden'}">弃权</span>
                                </div>
                                <div class="text-[10px] text-gray-500 mt-0.5 truncate max-w-[110px]">${p.teamName}</div>
                            </td>
                            <td class="py-2.5 text-center">
                                <button type="button" 
                                        onclick="setCheckinStatus(${p.id},${isPresent ? 0 : 1})"
                                        class="btn-present w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base transition ${isPresent ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-white text-gray-300 border-gray-300 hover:border-emerald-500'}">
                                    ✓
                                </button>
                            </td>
                            <td class="py-2.5 text-center">
                                <button type="button" 
                                        onclick="setCheckinStatus(${p.id},${isAbsent ? 0 : 2})"
                                        class="btn-absent w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base transition ${isAbsent ? 'bg-red-600 text-white border-red-600 shadow-sm' : 'bg-white text-gray-300 border-gray-300 hover:border-red-500'}">
                                    ✕
                                </button>
                            </td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>`;
        }

        const renderHeatCard = (group, elementId) => {
            group.athletes.sort((a,b) => parseInt(a.lane||0) - parseInt(b.lane||0));
            const realTime = formatRealDate(group.timeStr);
            let typeColor = group.category === 'fun' ? 'purple' : (group.isField ? 'orange' : 'blue');

            const isStarter = (currentRole === 'starter');
            const showPushBtn = isStarter && !group.isField;

            const totalCount = group.athletes.length;

            const handledCount = group.athletes.filter(p => {
                const state = getCheckedState(p);
                return state === 1 || state === 2; // 1到位，2弃权
            }).length;
            const isAllChecked = (totalCount > 0 && handledCount >= totalCount);

           // 🌟 1. 判断终点是否已经录入了有效比赛成绩（排除检录弃权，只看真实成绩）
            const hasRecordedScore = group.athletes.some(p => {
                const s = String(p.score !== undefined ? p.score : (p.start_score || '')).trim();
                const isAbandon = s.includes('弃权') || s.includes('DNS') || s.includes('DNF') || s.includes('DQ');
                return s !== '' && s !== '-' && !s.includes('待定') && !isAbandon;
            });

            // 🌟 2. 判断是否全员均已完赛（有成绩 或 弃权）
            const isAllFinished = totalCount > 0 && group.athletes.every(p => {
                const s = String(p.score !== undefined ? p.score : (p.start_score || '')).trim();
                const c = getCheckedState(p);
                return c === 2 || (s !== '' && s !== '-' && !s.includes('待定'));
            });

            // 只要终点录了任何一人的成绩，或者全员完赛，即视为比赛已出成绩（禁止重发！）
            const isHeatCompletedWithScore = hasRecordedScore || isAllFinished;
            const isAlreadyPushed = group.athletes.some(p => p.is_started === 1 || p.isStarted === 1) || isHeatCompletedWithScore;
            
            const isHeatDone = isStarter ? isAlreadyPushed : isAllChecked;
            const cardKey = `${group.groupName}_${group.eventName}_${group.gender}_${group.heat}`;

            let isExpanded = false;
            if (window.expandedHeatCards && window.expandedHeatCards.has(cardKey)) {
                isExpanded = true;
            } else if (cardKey === window.firstActivePendingHeatKey) {
                isExpanded = true;
            }

            // 折叠态卡片渲染
            if (isHeatDone && !isExpanded) {
                return `
                <div class="bg-gray-100/90 rounded-xl border border-gray-200 overflow-hidden mb-2.5 opacity-85 hover:opacity-100 transition">
                    <div class="p-3 flex justify-between items-center cursor-pointer select-none" onclick="toggleHeatCard('${cardKey}', '${elementId}')">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-500 font-mono">${realTime}</span>
                            <span class="font-bold text-gray-800 text-xs">${group.groupName} ${group.gender}组 · ${group.eventName} (第${group.heat}组)</span>
                        </div>
                        <div class="flex items-center gap-2">
                            ${(showPushBtn && !isHeatCompletedWithScore) ? `
                            <button type="button" onclick="event.stopPropagation(); pushHeatToFinish('${group.groupName}', '${group.eventName}', '${group.gender}', '${group.heat}', this, true)" 
                                    class="bg-amber-100 hover:bg-amber-200 text-amber-800 border border-amber-300 px-2 py-0.5 rounded text-[10px] font-black transition active:scale-95">
                                🔄 重发
                            </button>` : ''}
                            <span class="text-[10px] ${isHeatCompletedWithScore ? 'bg-slate-200 text-slate-700' : 'bg-emerald-100 text-emerald-800'} px-2 py-0.5 rounded-full font-bold">
                                ${isStarter ? (isHeatCompletedWithScore ? '✔ 已完赛' : '🏁 已发令') : '✔ 已检录'}
                            </span>
                            <span class="text-xs text-blue-600 font-bold">▼</span>
                        </div>
                    </div>
                    <div id="${elementId}" class="hidden bg-white border-t border-gray-200">
                        ${renderAthletesTable(group, typeColor)}
                    </div>
                </div>`;
            }

            // 展开态卡片渲染
            return `
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-3">
                <div class="bg-white border-b border-gray-100 p-3 flex flex-wrap justify-between items-center gap-2">
                    <div class="cursor-pointer flex-1 select-none" onclick="toggleHeatCard('${cardKey}', '${elementId}')">
                        <div class="text-[11px] font-black text-${typeColor}-600 mb-1 flex items-center gap-1">
                            <span>🕒</span> ${realTime}
                            <span class="checkin-status-badge ml-2 font-mono text-[10px] ${isAllChecked ? 'text-emerald-700 bg-emerald-50' : 'text-amber-700 bg-amber-50'} px-1.5 py-0.2 rounded font-bold">
                                ${isAllChecked ? '✔ 已检录' : `⏳ 检录中 ${handledCount}/${totalCount}`}
                            </span>
                        </div>
                        <div class="font-black text-gray-800 text-sm">
                            ${group.groupName} ${group.gender}组 · ${group.eventName}
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2 shrink-0">
                        ${showPushBtn ? (() => {
                            if (isHeatCompletedWithScore) {
                                // 🌟 终点已录成绩：锁定为“已完赛”，彻底禁止重发
                                return `
                                    <button disabled data-started="1" class="btn-push-heat bg-slate-200 text-slate-600 border border-slate-300 px-3 py-1.5 rounded-lg text-xs font-bold cursor-not-allowed flex items-center gap-1 select-none">
                                        <span>✔</span> <span>已完赛</span>
                                    </button>
                                `;
                            } else if (isAlreadyPushed) {
                                // 🌟 已发令但终点尚未录成绩：允许点击重发
                                return `
                                    <button onclick="pushHeatToFinish('${group.groupName}', '${group.eventName}', '${group.gender}', '${group.heat}', this, true)" 
                                            class="btn-push-heat bg-emerald-50 hover:bg-amber-100 text-emerald-700 hover:text-amber-800 border border-emerald-300 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition active:scale-95 cursor-pointer">
                                        <span>🏁</span> <span>已发令(点此重发)</span>
                                    </button>
                                `;
                            } else if (!isAllChecked) {
                                return `
                                    <button disabled onclick="pushHeatToFinish('${group.groupName}', '${group.eventName}', '${group.gender}', '${group.heat}', this)"
                                            title="需检录完毕后发令" 
                                            class="btn-push-heat bg-gray-100 border border-gray-300 text-gray-400 px-3 py-1.5 rounded-lg text-xs font-bold cursor-not-allowed flex items-center gap-1">
                                        <span>🔒</span> <span>等待检录(${handledCount}/${totalCount})</span>
                                    </button>
                                `;
                            } else if (window.isTrackBusy) {
                                return `
                                    <button disabled onclick="pushHeatToFinish('${group.groupName}', '${group.eventName}', '${group.gender}', '${group.heat}', this)"
                                            title="终点正在录入上一组成绩，请等待录完" 
                                            class="btn-push-heat bg-orange-50 border border-orange-300 text-orange-600 px-3 py-1.5 rounded-lg text-xs font-bold cursor-not-allowed flex items-center gap-1">
                                        <span>⏳</span> <span>跑道使用中</span>
                                    </button>
                                `;
                            } else {
                                return `
                                    <button onclick="pushHeatToFinish('${group.groupName}', '${group.eventName}', '${group.gender}', '${group.heat}', this)" 
                                            class="btn-push-heat bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs font-black shadow-md flex items-center gap-1 transition active:scale-95 animate-bounce cursor-pointer">
                                        <span>🚀</span> <span>发令推送</span>
                                    </button>
                                `;
                            }
                        })() : ''}

                        <span class="text-xs font-bold text-${typeColor}-700 bg-${typeColor}-100 px-2 py-1 rounded-lg cursor-pointer select-none" onclick="toggleHeatCard('${cardKey}', '${elementId}')">
                            第 ${group.heat} 组 ${isExpanded ? '▲' : '▼'}
                        </span>
                    </div>
                </div>
             
                <div id="${elementId}" class="${isExpanded ? '' : 'hidden'}">
                    ${renderAthletesTable(group, typeColor)}
                </div>
            </div>`;
};

        let html = '';
        const now = new Date();
        const curHour = now.getHours();
        const curAmpm = curHour < 12 || (curHour === 12 && now.getMinutes() < 30) ? '上午' : '下午';
        
        let curDayNum = 1;
        if (compStartDate) {
            const sDate = new Date(compStartDate);
            sDate.setHours(0,0,0,0);
            const nowDateOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const diffDays = Math.floor((nowDateOnly - sDate) / (1000 * 60 * 60 * 24)) + 1;
            curDayNum = Math.max(1, diffDays);
        }

        const currentActiveUnitKey = `${curDayNum}_${curAmpm}`;
        const sortedUnitKeys = Object.keys(units).sort((a,b) => {
            const ua = units[a], ub = units[b];
            if(ua.day !== ub.day) return ua.day - ub.day;
            return ua.ampm === '上午' ? -1 : 1;
        });

        sortedUnitKeys.forEach((uKey, uIdx) => {
            const unit = units[uKey];
            let dateTitle = `第${unit.day}天 ${unit.ampm}`;
            if (compStartDate) {
                let d = new Date(compStartDate);
                if (!isNaN(d.getTime())) {
                    d.setDate(d.getDate() + (unit.day - 1));
                    dateTitle = `${d.getMonth()+1}月${d.getDate()}日 ${unit.ampm}`;
                }
            }

            let isPastUnit = false;
            if (unit.day < curDayNum) isPastUnit = true;
            else if (unit.day === curDayNum && curAmpm === '下午' && unit.ampm === '上午') isPastUnit = true;

            const isCurrentUnit = (uKey === currentActiveUnitKey);
            let shouldExpand = window.userManuallyToggledUnits ? window.expandedUnits.has(uKey) : (isCurrentUnit || (!isPastUnit && uIdx === 0));
            if (shouldExpand) window.expandedUnits.add(uKey);

            const contentId = `unit_body_${uIdx}`;
            const arrowId = `unit_arrow_${uIdx}`;

            html += `

function fetchMeta() {

    fetch('/api/get_referee_meta?_t=' + Date.now())

function onGroupChange() {
    const gName = document.getElementById('selGroup').value;
    const selGender = document.getElementById('selGender');
    const selEvent = document.getElementById('selEvent');
    selGender.innerHTML = '<option value="">-- 选择性别 --</option>';

    if (!gName || !metaData[gName]) { selGender.disabled = true; return; }

    selGender.disabled = false;
}

function onGenderChange() {
    const gName = document.getElementById('selGroup').value;
    const gen = document.getElementById('selGender').value;
    const selEvent = document.getElementById('selEvent');
    selEvent.innerHTML = '<option value="">-- 选择项目 --</option>';
    if (!gen || !metaData[gName] || !metaData[gName][gen]) { 
        selEvent.disabled = true; 
        return; 
    }

    let eventItems = metaData[gName][gen];
    if (currentRole === 'timing') {
        // 径赛
        eventItems = eventItems.filter(item => {
            const t = typeof item === 'object' ? item.type : '';
            const name = typeof item === 'object' ? item.name : item;
            return t === '径赛' || (!t.includes('田') && !t.includes('趣味')) || name.includes('米') || name.includes('接力');
        });
    } else if (currentRole === 'field') {
        eventItems = eventItems.filter(item => {
            const t = typeof item === 'object' ? item.type : '';
            return t === '田赛' && !t.includes('趣味');
        });
    } else if (currentRole === 'fun') {
        eventItems = eventItems.filter(item => {
            const t = typeof item === 'object' ? item.type : '';
            const name = typeof item === 'object' ? item.name : item;
            return t === '趣味' || t === '趣味项目' || t === '健康测试' || ['拔河', '跳绳', '投篮', '绕杆', '穿梭', '袋鼠', '毛毛虫', '沙包'].some(k => name.includes(k));
        });
    }

    if (eventItems.length === 0) {
        selEvent.innerHTML = '<option value="">(该岗位下无匹配项目)</option>';
        selEvent.disabled = true;
        return;
    }

    eventItems.forEach(item => {
        const eName = typeof item === 'object' ? item.name : item;
        const eType = typeof item === 'object' ? item.type : '';
        const opt = document.createElement('option');
        opt.value = eName;
        opt.dataset.type = eType; 
        opt.innerText = eName;    
        selEvent.appendChild(opt);
    });
    selEvent.disabled = false;
}

function loadAthletes() {

    const list = document.getElementById('athleteList');

        if (highJumpPanel) highJumpPanel.classList.add('hidden');
        if (normalTable) normalTable.classList.remove('hidden');

        return;
    }

    if (list) list.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-blue-500 font-bold animate-pulse">正在获取运动员名单...</td></tr>';

    fetch('/api/get_event_start_list?_t=' + Date.now(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event_name: eName, group_name: gName, gender: gender })
    })
    .then(r => r.json())
    .then(data => {
        const filteredData = Array.isArray(data) ? data : [];
        if (filteredData.length === 0) {
            if (list) list.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-gray-400 font-bold">未找到【${gName} ${gender}子 ${eName}】的编排名单</td></tr>`;
            if (highJumpPanel) highJumpPanel.classList.add('hidden');
            if (normalTable) normalTable.classList.remove('hidden');
            if (controlBar) controlBar.classList.add('hidden');
            return;
        }

        const isHighJump = eName.includes('跳高') || eName.includes('撑竿跳');
        const isDistanceField = !isHighJump && (
            eName.includes('跳远') || eName.includes('三级跳') || eName.includes('铅球') || 
            eName.includes('实心球') || eName.includes('标枪') || eName.includes('铁饼')
        );

        if (isHighJump) {
            if (normalTable) normalTable.classList.add('hidden');
            if (controlBar) controlBar.classList.add('hidden');
            if (highJumpPanel) highJumpPanel.classList.remove('hidden');
            initHighJumpData(filteredData);
        } else {
            if (highJumpPanel) highJumpPanel.classList.add('hidden');
            if (normalTable) normalTable.classList.remove('hidden');

            if (currentRole === 'field' && isDistanceField) {
                if (controlBar) controlBar.classList.remove('hidden');
                initFieldAthletesData(filteredData);
                renderCurrentFieldList();
            } else {
                if (controlBar) controlBar.classList.add('hidden');
                renderNormalTrackList(filteredData);
            }
        }
    })
    .catch(err => {
        if (list) list.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-red-500 font-bold">加载名单失败，请检查网络或刷新重试</td></tr>';
    });
}

// 🌟 彻底补全：田赛 6 次试跳与前 8 强倒序出场系统
let currentFieldRound = 1; 
let fieldAthletesData = []; 

function initFieldAthletesData(data) {
    let localDraftMap = {};
    if (data.length > 0) {
        const storageKey = `field_draft_${data[0].event_name}_${data[0].group_name}_${data[0].gender}`;
        try {
            const rawDraft = localStorage.getItem(storageKey);
            if (rawDraft) {
                const draftArr = JSON.parse(rawDraft);
                draftArr.forEach(d => {
                    const k = `${d.name}_${d.team_name}`;
                    localDraftMap[k] = d.attempts;
                });
            }
        } catch(e) {}
    }

    fieldAthletesData = data.map((p, idx) => {
        let parsedAttempts = ['', '', '', '', '', ''];
        
        // 1. 优先读取后端已有的 attempts_json
        if (p.attempts_json && p.attempts_json.trim() !== '' && p.attempts_json !== '[]') {
            try { parsedAttempts = JSON.parse(p.attempts_json); } catch(e) {}
        } else if (p.score && p.score.trim() !== '' && p.score !== '弃权') {
            parsedAttempts[0] = String(p.score);
        }

        // 2. 本地若有录入未上传的内容，深度补充合并
        const draftKey = `${p.name}_${p.team_name}`;
        if (localDraftMap[draftKey]) {
            parsedAttempts = parsedAttempts.map((v, i) => {
                const draftVal = localDraftMap[draftKey][i];
                return draftVal !== undefined ? draftVal : v;
            });
        }
return {
            ...p,
            orderIndex: idx + 1,
            attempts: parsedAttempts
        };
    });
    currentFieldRound = 1;
    document.querySelectorAll('.round-pill').forEach(btn => {
        const r = parseInt(btn.dataset.round);
        if (r === 1) {
            btn.className = "round-pill px-3 py-1 rounded-lg text-xs font-black bg-orange-600 text-white shadow-xs";
        } else {
            btn.className = "round-pill px-3 py-1 rounded-lg text-xs font-bold bg-white text-gray-600 border border-gray-200";
            if (r > 3) btn.disabled = true;
        }
    });
}
window.switchFieldRound = function(roundNum) {

        if (parseInt(btn.dataset.round) === roundNum) {

    setTimeout(() => {

        const target = firstUnscored || fieldAthletesData[0];

// ========================================================
// 🌟 田赛纯前端离线规则算法（世界田联 TR 25.6 次优成绩决胜）
// ========================================================

// 1. 计算选手的排序比对向量：[第1好成绩, 第2好成绩, 第3好成绩, ..., 第6好成绩]
function getFieldTieBreakerVector(attemptsArr, limitRounds = 3) {
    let validScores = [];
    for (let i = 0; i < Math.min(attemptsArr.length, limitRounds); i++) {
        let valStr = String(attemptsArr[i] || '').trim().replace('：', '.').replace(':', '.');
        let num = parseFloat(valStr);
        if (!isNaN(num) && num > 0) {
            validScores.push(num);
        }
    }
    // 降序排列：由大到小比对
    validScores.sort((a, b) => b - a);
    while (validScores.length < 6) {
        validScores.push(0);
    }
    return validScores;
}

// 2. 比对两名选手的优劣 (Vector A vs Vector B)
function compareFieldVectors(vecA, vecB) {
    for (let i = 0; i < 6; i++) {
        if (Math.abs(vecA[i] - vecB[i]) > 0.0001) {
            return vecB[i] - vecA[i]; // 大的排前面
        }
    }
    return 0; // 完全相同
}

// ========================================================
// 🌟 纯前端离线截取前 8 强并倒序出场
// ========================================================
window.settleTop8ForFinals = function() {
    if (!fieldAthletesData || fieldAthletesData.length === 0) {
        return alert("暂无参赛选手数据！");
    }

    // 1. 纯本地提取前3轮成绩并生成决胜向量
    let qualifiedList = [];
    fieldAthletesData.forEach(ath => {
        let atts = ath.attempts || ['', '', '', '', '', ''];
        let vec = getFieldTieBreakerVector(atts, 3);
        
        // 只要前3轮有至少一次有效成绩（大于0米）
        if (vec[0] > 0) {
            qualifiedList.push({
                ...ath,
                _vec: vec,
                prelimBest: vec[0].toFixed(2)
            });
        }
    });

    if (qualifiedList.length === 0) {
        return alert("⚠️ 前3轮尚未录入任何有效成绩（需大于0米），无法截取前8名！\n如均弃权或犯规，请先录入有效成绩。");
    }

    if (!confirm(`已在本地检测到 ${qualifiedList.length} 名选手具备有效成绩。\n确定根据前3轮成绩截取前8名进入后3轮决赛，并按倒序排定出场次序吗？`)) {
        return;
    }

    // 2. 本地执行全排序（世界田联平分决胜：第1好 -> 第2好 -> 第3好）
    qualifiedList.sort((a, b) => compareFieldVectors(a._vec, b._vec));

    // 3. 截取前 8 名（不足 8 名则全部录取）
    let top8 = qualifiedList.slice(0, 8);

    // 标记预赛排位名次（1 ~ 8）
    top8.forEach((ath, idx) => {
        ath.prelim_rank = idx + 1;
    });

    // 4. 倒序出场（预赛第8名排在第1位试跳，预赛第1名最后压轴试跳）
    top8.reverse();

    // 分配后3轮的出场序号（1 ~ N）
    top8.forEach((ath, idx) => {
        delete ath._vec;
        ath.orderIndex = idx + 1; // 决赛实际出场次序
        ath.isFinalist = true;
    });

    // 5. 覆盖当前列表并激活第 4、5、6 轮
    fieldAthletesData = top8;

    [4, 5, 6].forEach(r => {
        let btn = document.getElementById(`btnRound${r}`);
        if (btn) {
            btn.disabled = false;
            btn.className = "round-pill px-3 py-1 rounded-lg text-xs font-bold bg-white text-gray-600 border border-gray-200";
        }
    });

    // 6. 保存到本地 LocalStorage 防丢
    const storageKey = `field_draft_${fieldAthletesData[0]?.event_name}_${fieldAthletesData[0]?.group_name}_${fieldAthletesData[0]?.gender}`;
    try {
        localStorage.setItem(storageKey, JSON.stringify(fieldAthletesData));
    } catch(e) {}

    // 7. 切换进入第 4 轮
    switchFieldRound(4);

    if (typeof triggerVibrate === 'function') triggerVibrate([50, 50, 50]);
    alert(`🎉 【本地离线决胜完成】\n已成功按田径规则截取前 ${top8.length} 名晋级决赛！\n出场顺序已自动倒序（第8名先出场，第1名最后出场），可直接进行第4轮试跳。`);
};

// ========================================================
// 🌟 纯前端单次成绩录入（本地防抖秒存，断网不丢）
// ========================================================
window.saveFieldScore = function(regId, roundNum, input, callback) {
    const key = `${regId}_${roundNum}`;
    if (typeof fieldDebounceTimers !== 'undefined') clearTimeout(fieldDebounceTimers[key]);

    let val = input.value.trim().replace('：', '.').replace(':', '.');
    input.value = val;
    let athlete = fieldAthletesData.find(a => (a.reg_id || a.id) === regId);
    if (!athlete) return;

    if (!athlete.attempts) athlete.attempts = ['', '', '', '', '', ''];
    athlete.attempts[roundNum - 1] = val;

    // 本地即时计算当前所有轮次最好成绩
    let allValid = athlete.attempts.map(v => parseFloat(v) || 0);
    let overallBest = Math.max(0, ...allValid);
    athlete.score = overallBest > 0 ? overallBest.toFixed(2) : (athlete.attempts.some(v => String(v).includes('弃权')) ? '弃权' : '');

    // 🌟 1. 核心：优先写入 LocalStorage 离线数据库
    const storageKey = `field_draft_${athlete.event_name}_${athlete.group_name}_${athlete.gender}`;
    try {
        localStorage.setItem(storageKey, JSON.stringify(fieldAthletesData));
    } catch (e) {}

    // 更新页面展示
    if (typeof updateFieldRowDOM === 'function') {
        updateFieldRowDOM(athlete, roundNum);
    }

    input.classList.remove('saving', 'error');
    input.classList.add('saved');
    setTimeout(() => input.classList.remove('saved'), 500);

    // 🌟 2. 弱网尝试异步静默推送给后台草稿，断网失败也完全不弹窗阻断，静默兜底
    fetch('/api/draft_field_score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            id: athlete.id,
            reg_id: athlete.reg_id,
            score: athlete.score,
            attempts_json: JSON.stringify(athlete.attempts)
        })
    }).catch(() => {
        // 静默捕获网络错误，不影响裁判继续录入！
    });

    if (typeof triggerVibrate === 'function') triggerVibrate(40);
    if (typeof callback === 'function') callback({ status: 'success' });
};

// ========================================================
// 🌟 比赛全部结束：前端一键汇总打包，统一上传管理端
// ========================================================
window.finalizeFieldCompetition = function() {
    if (!fieldAthletesData || fieldAthletesData.length === 0) {
        return alert("暂无选手数据！");
    }

    // 检查是否有未录完的情况并给予友好确认
    if (!confirm("⚠️ 确定要统一上传本项目的全部成绩并结算名次与总积分吗？\n上传后管理端将立刻生成最终成绩公告与积分排名。")) {
        return;
    }

    // 打包 6 轮明细及最高成绩
    const payloadList = fieldAthletesData.map(p => {
        let atts = p.attempts || ['', '', '', '', '', ''];
        let allValid = atts.map(v => parseFloat(v) || 0);
        let best = Math.max(0, ...allValid);
        let hasAbandon = atts.some(v => String(v).includes('弃权'));
        let finalScoreStr = best > 0 ? best.toFixed(2) : (hasAbandon ? '弃权' : '');

        return {
            id: p.id,
            reg_id: p.reg_id || p.id,
            name: p.name,
            team_name: p.team_name,
            group_name: p.group_name,
            gender: p.gender,
            event_name: p.event_name,
            score: finalScoreStr,
            attempts_json: JSON.stringify(atts)
        };
    });

    showTip("⏳ 正在批量上传全项目成绩...", "text-blue-600");

    fetch('/api/batch_submit_field_scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ athletes: payloadList })
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === 'success') {
            // 上传成功，清除本地临时草稿
            const storageKey = `field_draft_${fieldAthletesData[0]?.event_name}_${fieldAthletesData[0]?.group_name}_${fieldAthletesData[0]?.gender}`;
            try { localStorage.removeItem(storageKey); } catch (e) {}

            if (typeof triggerVibrate === 'function') triggerVibrate([80, 50, 80]);
            showTip("✅ 全部成绩已成功上传！", "text-emerald-600");
            alert(`🎉 恭喜！田赛成绩已全部统一上传至管理端！\n${res.msg || ''}`);
            loadAthletes(); // 刷新恢复默认状态
        } else {
            alert("❌ 上传失败: " + res.msg + "\n请检查网络连接后重试！本地数据已完整保存，不会丢失。");
        }
    })
    .catch(err => {
        alert("❌ 无法连接到服务器，请检查手机网络或服务器状态！\n不必担心，所有成绩已完整保存在您当前这台手机中，联网后重新点击上传即可。");
    });
};function updateFieldRowDOM(athlete, roundIndex) {
    const athId = athlete.reg_id || athlete.id;
    const pillsContainer = document.getElementById(`field_pills_${athId}`);
    if (pillsContainer) {
        pillsContainer.innerHTML = athlete.attempts.map((att, idx) => `

    }

    const bestEl = document.getElementById(`field_best_${athId}`);

}

// 🌟 田赛防抖计时器字典
let fieldDebounceTimers = {};

// 🌟 田赛 1 秒无操作自动保存函数
window.autoSaveFieldScoreDebounced = function(regId, roundNum, input) {
    const key = `${regId}_${roundNum}`;
    clearTimeout(fieldDebounceTimers[key]);

    // 用户正在输入时显示淡黄等待背景
    input.classList.remove('saved', 'error');
    input.classList.add('saving');

    fieldDebounceTimers[key] = setTimeout(() => {
        saveFieldScore(regId, roundNum, input);
    }, 1000); // 1秒无输入自动触发保存
};

window.saveAndNextFieldAthlete = function(regId, roundNum) {
    const athId = regId;
    const currentInput = document.getElementById(`field_input_${athId}`);
    if (currentInput) {
        saveFieldScore(athId, roundNum, currentInput);
    }
    // 寻找下一个有效选手
    const currIdx = fieldAthletesData.findIndex(a => (a.reg_id || a.id) === athId);
    if (currIdx >= 0 && currIdx < fieldAthletesData.length - 1) {
        const nextAthlete = fieldAthletesData[currIdx + 1];
        const nextId = nextAthlete.reg_id || nextAthlete.id;
        const nextInput = document.getElementById(`field_input_${nextId}`);
        if (nextInput) {
            nextInput.focus();
            nextInput.select();
            nextInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(30);
        }
    } else if (currIdx === fieldAthletesData.length - 1) {
        // 当前轮次最后一人录毕提示
        if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([40, 40, 40]);
        if (roundNum < 3) {
            if (confirm(`🎉 第 ${roundNum} 轮已全部录入完毕！\n是否直接切换进入【第 ${roundNum + 1} 轮】试跳？`)) {
                switchFieldRound(roundNum + 1);
            }
        } else if (roundNum === 3) {
            alert(`🎉 前 3 轮已全部录入完成！\n请点击上方【⚡ 截取前8决赛】按规程倒序重排进入后 3 轮试跳。`);
        } else if (roundNum < 6) {
            if (confirm(`🎉 第 ${roundNum} 轮决赛已录完！\n是否直接切换进入【第 ${roundNum + 1} 轮】？`)) {
                switchFieldRound(roundNum + 1);
            }
        } else {
            alert(`🎉 全部 6 轮试跳已录入完毕！请点击上方【提交最终名次】核算总分！`);
        }
    }
};

// 🌟 彻底补全：跳高与撑竿跳高全套升杆/试跳打分系统
let hjHeights = ["1.00", "1.05", "1.10", "1.15", "1.20", "1.25", "1.30", "1.35", "1.40"];
let curHjIndex = 0;
let hjAthletes = [];

function recalcHjAthleteState(ath) {
    let best = 0;
    let consecutiveX = 0;
    const sortedH = Object.keys(ath.records || {}).sort((a, b) => parseFloat(a) - parseFloat(b));
    sortedH.forEach(h => {
        const arr = ath.records[h] || [];
        arr.forEach(val => {
            if (val === 'O') {
                if (parseFloat(h) > best) best = parseFloat(h);
                consecutiveX = 0;
            } else if (val === 'X') {
                consecutiveX++;
            }
        });
    });
    ath.bestHeight = best > 0 ? best.toFixed(2) : '';
    ath.eliminated = (consecutiveX >= 3);
}

function initHighJumpData(data) {
    hjAthletes = data.map(p => {
        let parsedRecords = {};
        try { if (p.attempts_json) parsedRecords = JSON.parse(p.attempts_json); } catch(e) {}
        const ath = { ...p, records: parsedRecords, eliminated: false, bestHeight: p.score || '' };
        recalcHjAthleteState(ath);
        return ath;
    });
    curHjIndex = 0;
    renderHighJumpHeightPills();
    renderHighJumpAthletes();
}
function renderHighJumpHeightPills() {
    const container = document.getElementById('highJumpBarPills');
    if (!container) return;

    let html = hjHeights.map((h, idx) => {
        const isCur = (idx === curHjIndex);
        return `
            <button onclick="switchHjHeight(${idx})" 
                    class="px-3 py-1.5 rounded-lg text-xs font-black shrink-0 transition ${isCur ? 'bg-indigo-600 text-white shadow-md scale-105' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                ${h}m
            </button>
        `;
    }).join('');

    html += `
        <button onclick="addCustomHjHeight()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 shrink-0">
            +加高
        </button>
    `;
    container.innerHTML = html;
    document.getElementById('currentBarText').innerText = hjHeights[curHjIndex] + 'm';
}

function switchHjHeight(idx) {
    curHjIndex = idx;
    renderHighJumpHeightPills();
    renderHighJumpAthletes();
}

function addCustomHjHeight() {
    const val = prompt("请输入要添加的新高度 (如 1.42):");
    if (val && !isNaN(parseFloat(val))) {
        const formatted = parseFloat(val).toFixed(2);
        if (!hjHeights.includes(formatted)) {
            hjHeights.push(formatted);
            hjHeights.sort((a, b) => parseFloat(a) - parseFloat(b));
            curHjIndex = hjHeights.indexOf(formatted);
            renderHighJumpHeightPills();
            renderHighJumpAthletes();
        }
    }
}

function renderHighJumpAthletes() {
    const container = document.getElementById('highJumpAthletesContainer');
    if (!container) return;

    const curH = hjHeights[curHjIndex];
    let aliveCount = 0;

    let html = hjAthletes.map(ath => {
        const attempts = ath.records[curH] || [];
        const isPassed = attempts.includes('O');
        if (!ath.eliminated) aliveCount++;

        return `
        <div class="bg-white rounded-xl p-3 border ${isPassed ? 'border-emerald-300 bg-emerald-50/20' : (ath.eliminated ? 'border-gray-200 bg-gray-50 opacity-60' : 'border-gray-200')} shadow-xs flex items-center justify-between transition">
            <div>
                <div class="flex items-center gap-1.5">
                    <span class="font-mono text-xs font-bold text-indigo-600">${ath.bib ? '#' + ath.bib : '--'}</span>
                    <span class="font-black text-sm text-gray-800 ${ath.eliminated ? 'line-through text-gray-400' : ''}">${ath.name}</span>
                    ${ath.eliminated ? '<span class="text-[9px] bg-red-100 text-red-600 px-1 rounded font-bold">淘汰</span>' : ''}
                </div>
                <div class="text-[11px] text-gray-400 mt-1">
                    最好成绩: <span class="font-mono font-black text-indigo-700">${ath.bestHeight ? ath.bestHeight + 'm' : '--'}</span>
                </div>
            </div>

            <div class="flex items-center gap-1.5">
                ${[0, 1, 2].map(attIdx => {
                    const val = attempts[attIdx] || '';
                    let btnStyle = "bg-gray-100 text-gray-300 border-gray-200";
                    if (val === 'O') btnStyle = "bg-emerald-600 text-white font-black shadow-xs";
                    else if (val === 'X') btnStyle = "bg-red-100 text-red-700 font-black border border-red-200";
                    else if (val === '-') btnStyle = "bg-gray-200 text-gray-600 font-black";

                    const isDisabled = (ath.eliminated && val !== 'X') || (isPassed && val !== 'O');

                    return `
                        <button onclick="cycleHjAttempt('${ath.id || ath.reg_id}', '${curH}', ${attIdx})" 
                                ${isDisabled ? 'disabled' : ''}
                                class="w-9 h-9 rounded-lg text-sm flex items-center justify-center transition active:scale-95 ${btnStyle} ${isDisabled ? 'cursor-not-allowed' : ''}">
                            ${val || '+'}
                        </button>
                    `;
                }).join('')}
            </div>
        </div>`;
    }).join('');

    container.innerHTML = html;
    document.getElementById('highJumpAliveStat').innerText = `在场: ${aliveCount}人 / 淘汰: ${hjAthletes.length - aliveCount}人`;
}

function cycleHjAttempt(athId, height, attIdx) {
    const ath = hjAthletes.find(a => String(a.id || a.reg_id) === String(athId));
    if (!ath) return;

    if (!ath.records[height]) ath.records[height] = [];
    const currentVal = ath.records[height][attIdx] || '';
    let nextVal = 'X';
    if (currentVal === '') nextVal = 'X';
    else if (currentVal === 'X') nextVal = 'O';
    else if (currentVal === 'O') nextVal = '-';
    else if (currentVal === '-') nextVal = '';

    ath.records[height][attIdx] = nextVal;
    recalcHjAthleteState(ath);
    saveHjScoreToBackend(ath, ath.bestHeight);
    renderHighJumpAthletes();
}
function highJumpPassAllUnjumped() {
    const curH = hjHeights[curHjIndex];
    hjAthletes.forEach(ath => {
        if (!ath.eliminated && (!ath.records[curH] || ath.records[curH].length === 0)) {
            ath.records[curH] = ['O'];
            ath.bestHeight = curH;
            saveHjScoreToBackend(ath, curH);
        }
    });
    renderHighJumpAthletes();
}

function highJumpNextBar() {
    if (curHjIndex < hjHeights.length - 1) switchHjHeight(curHjIndex + 1);
    else addCustomHjHeight();
}

function saveHjScoreToBackend(ath, score) {
    const targetId = ath.reg_id || ath.id;
    fetch('/api/submit_score', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id: targetId, score: String(score), attempts: JSON.stringify(ath.records) })
    });
}

function renderNormalTrackList(filteredData) {
    const list = document.getElementById('athleteList');
    if (!list) return;
    let html = '';

    const heatsMap = {};
    filteredData.forEach(p => {
        const h = String(p.heat || '1');
        if (!heatsMap[h]) heatsMap[h] = [];
        heatsMap[h].push(p);
    });

    let firstUnscoredInputId = null;
    const sortedHeats = Object.keys(heatsMap).sort((a, b) => parseInt(a) - parseInt(b));

    // 🌟 检查当前项目是否为接力或团体项目
    const curEventName = document.getElementById('selEvent')?.value || filteredData[0]?.event_name || '';
    const isRelayEvent = curEventName.includes('接力') || curEventName.includes('4×') || curEventName.includes('4*') || curEventName.includes('4x');

    sortedHeats.forEach(heatNum => {
        let heatItems = heatsMap[heatNum];

        // 接力项目按 代表队 去重，一个班级队伍只展示一行
        if (isRelayEvent) {
            const teamMap = {};
            heatItems.forEach(p => {
                const tKey = String(p.team_name || p.teamName || p.lane).trim();
                if (!teamMap[tKey]) {
                    teamMap[tKey] = { ...p };
                } else {
                    if ((!teamMap[tKey].score || teamMap[tKey].score === '-') && p.score) teamMap[tKey].score = p.score;
                    if ((!teamMap[tKey].checked_in || teamMap[tKey].checked_in === 0) && p.checked_in) teamMap[tKey].checked_in = p.checked_in;
                    if (p.name && p.name.length > (teamMap[tKey].name || '').length) teamMap[tKey].name = p.name;
                }
            });
            heatItems = Object.values(teamMap);
        }

        const totalCount = heatItems.length;
        // 统计已出成绩（无论有效成绩还是弃权/犯规）
        const scoredCount = heatItems.filter(p => {
            const s = String(p.score !== undefined && p.score !== null ? p.score : '').trim();
            const checkState = parseInt(p.checked_in !== undefined ? p.checked_in : (p.checkedIn || 0));
            return (s !== '' && s !== '-') || checkState === 2;
        }).length;

        const isHeatFinished = (totalCount > 0 && scoredCount === totalCount);
        const heatArrowId = `timing_heat_arrow_${heatNum}`;

        html += `
        <tr class="border-y border-blue-200 cursor-pointer select-none transition ${isHeatFinished ? 'bg-gray-100 text-gray-600' : 'bg-blue-50 text-blue-900'}"
            onclick="toggleTimingHeat('${heatNum}', '${heatArrowId}')">
            <td colspan="4" class="p-2.5 px-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="font-black text-sm">🚩 第 ${heatNum} 组</span>
                        <span id="timing_heat_badge_${heatNum}" class="text-[11px] font-bold px-2 py-0.5 rounded-full ${isHeatFinished ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                            ${isHeatFinished ? `✔ 成绩已录毕 (${scoredCount}/${totalCount})` : `⏳ 录入中 (${scoredCount}/${totalCount})`}
                        </span>
                    </div>
                    <span id="${heatArrowId}" class="text-xs font-bold text-blue-600">${isHeatFinished ? '展开查看成绩 ▼' : '▲ 收起'}</span>
                </div>
            </td>
        </tr>`;

        heatItems.forEach(p => {
            const val = String(p.score || '').trim();
            const checkState = parseInt(p.checked_in !== undefined ? p.checked_in : (p.checkedIn || 0));
            
            // 🌟 严格判定是否弃权/犯规
            const isAbandoned = (checkState === 2) || val.includes('弃权') || val.includes('DNS') || val.includes('DNF');
            const isDQ = val.includes('犯规') || val.includes('DQ');
            const isAbsent = isAbandoned || isDQ;

            const inputId = `score_input_${p.reg_id || p.id}`;

            if (!isHeatFinished && !isAbsent && !val && !firstUnscoredInputId) {
                firstUnscoredInputId = inputId;
            }

            // 构建姓名部分的 DOM
            let nameHtml = `<span class="name-text transition-all ${isAbsent ? 'line-through text-gray-400 opacity-60' : 'text-gray-800'}">${p.name}</span>`;
            let tagHtml = '';
            
            if (isAbandoned) {
                tagHtml = `<span class="tag-status text-[9px] bg-red-100 text-red-600 px-1 rounded font-bold ml-1">弃权</span>`;
            } else if (isDQ) {
                tagHtml = `<span class="tag-status text-[9px] bg-amber-100 text-amber-700 px-1 rounded font-bold ml-1">犯规</span>`;
            }

            html += `
            <tr data-heat-row="${heatNum}" id="row_${inputId}" class="border-b border-gray-100 ${isHeatFinished ? 'hidden' : ''} ${isAbsent ? 'bg-red-50/40' : 'bg-white'} hover:bg-gray-50 transition">
                <td class="p-2 text-center font-bold text-gray-400 border-r w-12 text-sm">${p.lane || '-'}</td>
                <td class="p-2 text-center font-mono font-bold ${isAbsent ? 'text-gray-400' : 'text-blue-600'} text-xs border-r w-14">${isRelayEvent ? '---' : (p.bib || '---')}</td>
                <td class="p-2">
                    <div class="font-black text-xs flex items-center">
                        ${nameHtml}${tagHtml}
                    </div>
                    <div class="text-[10px] text-gray-500 font-bold truncate max-w-[140px]">${p.team_name}</div>
                </td>
                <td class="p-2 text-right w-40">
                    <div class="flex items-center justify-end gap-1">
                        <input type="text" inputmode="decimal" value="${val}" 
       id="${inputId}"
       placeholder=""
       data-heat="${heatNum}"
       data-last-val="${val}"
       class="input-score w-24 border border-blue-200 bg-blue-50/50 rounded-lg p-1.5 text-center shadow-inner text-blue-950 font-bold text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-400"
       onkeydown="if(event.key==='Enter'||event.keyCode===13){event.preventDefault(); this.blur();}"
       onblur="handleTrackScoreBlur(this, ${p.id}, {id:${p.id}, reg_id:${p.reg_id || p.id}, name:'${p.name}', team_name:'${p.team_name}', group_name:'${p.group_name}', event_name:'${p.event_name}', gender:'${p.gender}', heat:'${heatNum}'})">
                        <div class="flex items-center gap-1 shrink-0">
                            <button type="button" onclick="quickMarkDQ(${p.id}, this, {id:${p.id}, reg_id:${p.reg_id || p.id}, name:'${p.name}', team_name:'${p.team_name}', group_name:'${p.group_name}', event_name:'${p.event_name}', gender:'${p.gender}', heat:'${heatNum}'})" 
                                    class="px-1.5 py-1 text-[10px] font-bold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-md active:scale-95 transition">
                                犯规
                            </button>
                            <button type="button" onclick="quickMarkAbsent(${p.id}, this, {id:${p.id}, reg_id:${p.reg_id || p.id}, name:'${p.name}', team_name:'${p.team_name}', group_name:'${p.group_name}', event_name:'${p.event_name}', gender:'${p.gender}', heat:'${heatNum}'})" 
                                    class="px-1.5 py-1 text-[10px] font-bold text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 rounded-md active:scale-95 transition">
                                弃权
                            </button>
                        </div>
                    </div>
                </td>
            </tr>`;
        });
    });

    list.innerHTML = html;
    sortedHeats.forEach(h => updateTimingHeatProgress(h));

    if (firstUnscoredInputId) {
        setTimeout(() => {
            const targetInput = document.getElementById(firstUnscoredInputId);
            if (targetInput) {
                targetInput.focus();
                targetInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 150);
    }
}
window.toggleTimingHeat = function(heatNum, arrowId) {
    const rows = document.querySelectorAll(`#athleteList tr[data-heat-row="${heatNum}"]`);
    const arr = document.getElementById(arrowId);
    if (!rows || rows.length === 0) return;

    const isHidden = rows[0].classList.contains('hidden');
    rows.forEach(r => {
        if (isHidden) r.classList.remove('hidden');
        else r.classList.add('hidden');
    });
    if (arr) arr.innerText = isHidden ? '▲ 收起' : '展开查看成绩 ▼';
};

let trackDebounceTimers = {};
window.autoSaveTrackScoreDebounced = function(regId, input, pData) {
    clearTimeout(trackDebounceTimers[regId]);
    input.classList.remove('saved', 'error');
    input.classList.add('saving');
    const hNum = input.dataset.heat || (pData && pData.heat) || '1';
    updateTimingHeatProgress(hNum);

    trackDebounceTimers[regId] = setTimeout(() => {
        saveScore(regId, input, pData);
    }, 1000); // 1秒无输入自动触发保存
};

function updateTimingHeatProgress(heatNum) {
    const h = String(heatNum || '1');
    const badge = document.getElementById(`timing_heat_badge_${h}`);
    if (!badge) return;

    const inputs = Array.from(document.querySelectorAll(`#athleteList .input-score[data-heat="${h}"]`));
    const totalCount = inputs.length;
    if (totalCount === 0) return;

    const scoredCount = inputs.filter(inp => {
        const v = String(inp.value || '').trim();
        return v !== '' && v !== '-';
    }).length;

    const isFinished = (totalCount > 0 && scoredCount >= totalCount);
    if (isFinished) {
        badge.className = "text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800";
        badge.innerText = `✔ 成绩已录毕 (${scoredCount}/${totalCount})`;
    } else {
        badge.className = "text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800";
        badge.innerText = `⏳ 录入中 (${scoredCount}/${totalCount})`;
    }
}

window.handleTrackScoreBlur = function(input, regId, pData) {
    const val = input.value.trim();
    const lastVal = input.dataset.lastVal || '';
    
    // 内容未变更时不重复发网络包
    if (val === lastVal) return;
    input.dataset.lastVal = val;
    saveScore(regId, input, pData);
};

function saveScore(regId, input, pData) {
    const val = input.value.trim();
    
    // 🌟 核心修复：为了允许清空，这里不能直接 return，即使是空串也要发给后端
    
    input.classList.remove('saving', 'error');
    input.classList.add('saved');
    if (typeof triggerVibrate === 'function') triggerVibrate(30);
    setTimeout(() => input.classList.remove('saved'), 400);

    // 🌟 强制清除/更新视觉状态
    const row = input.closest('tr');
    if (row) {
        const isAbandoned = val.includes('弃权') || val.includes('DNS') || val.includes('DNF');
        const isDQ = val.includes('犯规') || val.includes('DQ');
        const isAbsent = isAbandoned || isDQ;
        
        const nameSpan = row.querySelector('.name-text');
        const tagSpan = row.querySelector('.tag-status');
        
        row.classList.remove('bg-red-50/40');
        if (nameSpan) nameSpan.classList.remove('line-through', 'text-gray-400', 'opacity-60');
        if (tagSpan) tagSpan.remove();

        // 如果输入了弃权/犯规，重新加上样式
        if (isAbsent) {
            row.classList.add('bg-red-50/40');
            if (nameSpan) nameSpan.classList.add('line-through', 'text-gray-400', 'opacity-60');
            
            const nameContainer = row.querySelector('td:nth-child(3) div:first-child');
            if (nameContainer) {
                const newTag = document.createElement('span');
                newTag.className = 'tag-status text-[9px] px-1 rounded font-bold ml-1';
                if (isAbandoned) {
                    newTag.classList.add('bg-red-100', 'text-red-600');
                    newTag.innerText = '弃权';
                } else {
                    newTag.classList.add('bg-amber-100', 'text-amber-700');
                    newTag.innerText = '犯规';
                }
                nameContainer.appendChild(newTag);
            }
        }
    }

    fetch('/api/submit_score', {
        method: 'POST', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify({ 
            id: regId, 
            score: val, // 发送空串或者新成绩
            name: pData?.name,
            team_name: pData?.team_name,
            group_name: pData?.group_name,
            event_name: pData?.event_name,
            gender: pData?.gender
        }) 
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === 'success') {
            input.value = res.new_score || ''; 
            input.dataset.lastVal = res.new_score || '';
            updateTimingHeatProgress(input.dataset.heat || pData?.heat || '1');
        } else {
            input.classList.add('error');
            input.dataset.lastVal = '';
            alert("保存失败：" + res.msg);
        }
    })
    .catch(() => {
        input.classList.add('error');
        input.dataset.lastVal = '';
    });
}
function showTip(msg, colorClass) {
    const tip = document.getElementById('statusTip');
    tip.innerText = msg; tip.className = "text-xs font-bold py-2 " + colorClass;
}
function updateHeatCardCheckinProgress(rowElement) {
    if (!rowElement) return;
    const heatContainer = rowElement.closest('.bg-white.rounded-xl') || rowElement.closest('.bg-gray-100');
    if (!heatContainer) return;

    // 统计当前卡片下的所有选手行
    const allRows = heatContainer.querySelectorAll('tbody tr[id^="checkin_row_"]');
    const total = allRows.length;
    let handled = 0;

    allRows.forEach(r => {
        const btnPresent = r.querySelector('.btn-present');
        const btnAbsent = r.querySelector('.btn-absent');
        // 仅根据背景样式判断状态，避免 innerText 恒为 true 的问题
        const isPresent = btnPresent && btnPresent.classList.contains('bg-emerald-600');
        const isAbsent = btnAbsent && btnAbsent.classList.contains('bg-red-600');
        if (isPresent || isAbsent) handled++;
    });

    const isAllDone = (total > 0 && handled >= total);

    // 1. 安全查找顶部状态徽章，避免非法选择器报错
    const badge = heatContainer.querySelector('.checkin-status-badge') || heatContainer.querySelector('span[class*="font-mono"]');
    if (badge) {
        if (isAllDone) {
            badge.className = "checkin-status-badge ml-2 font-mono text-[10px] text-emerald-700 bg-emerald-50 px-1.5 py-0.2 rounded font-bold";
            badge.innerText = "✔ 已检录";
        } else {
            badge.className = "checkin-status-badge ml-2 font-mono text-[10px] text-amber-700 bg-amber-50 px-1.5 py-0.2 rounded font-bold";
            badge.innerText = `⏳ 检录中 ${handled}/${total}`;
        }
    }

    // 2. 如果是起点发令端，同步更新发令推送按钮
    const pushBtn = heatContainer.querySelector('.btn-push-heat');
    if (pushBtn && !pushBtn.dataset.started) {
        if (isAllDone && !window.isTrackBusy) {
            pushBtn.disabled = false;
            pushBtn.className = "btn-push-heat bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs font-black shadow-md flex items-center gap-1 transition active:scale-95 animate-bounce cursor-pointer";
            pushBtn.innerHTML = `<span>🚀</span> <span>发令推送</span>`;
            pushBtn.title = "点击通知终点准备计时";
        } else if (!isAllDone) {
            pushBtn.disabled = true;
            pushBtn.className = "btn-push-heat bg-gray-100 border border-gray-300 text-gray-400 px-3 py-1.5 rounded-lg text-xs font-bold cursor-not-allowed flex items-center gap-1";
            pushBtn.innerHTML = `<span>🔒</span> <span>等待检录(${handled}/${total})</span>`;
            pushBtn.title = "需检录完毕后发令";
        } else if (window.isTrackBusy) {
            pushBtn.disabled = true;
            pushBtn.className = "btn-push-heat bg-orange-50 border border-orange-300 text-orange-600 px-3 py-1.5 rounded-lg text-xs font-bold cursor-not-allowed flex items-center gap-1";
            pushBtn.innerHTML = `<span>⏳</span> <span>跑道使用中</span>`;
            pushBtn.title = "终点正在录入上一组成绩，请等待录完";
        }
    }
}
function setCheckinStatus(startId, targetStatus) {
    const row = document.getElementById(`checkin_row_${startId}`);
    if (!row) return;

    const btnPresent = row.querySelector('.btn-present');
    const btnAbsent = row.querySelector('.btn-absent');
    const nameSpan = row.querySelector('.ath-name');
    const tagAbsent = row.querySelector('.tag-absent');

    row.classList.remove('bg-emerald-50', 'bg-red-50');
    if (nameSpan) nameSpan.classList.remove('line-through', 'text-gray-400');
    if (tagAbsent) tagAbsent.classList.add('hidden');

    if (targetStatus === 1) { // 到位
        row.classList.add('bg-emerald-50');
        if (btnPresent) {
            btnPresent.className = "btn-present w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base transition bg-emerald-600 text-white border-emerald-600 shadow-sm";
            btnPresent.setAttribute('onclick', `setCheckinStatus(${startId}, 0)`); // 再次点击可取消
        }
        if (btnAbsent) {
            btnAbsent.className = "btn-absent w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base transition bg-white text-gray-300 border-gray-300 hover:border-red-500";
            btnAbsent.setAttribute('onclick', `setCheckinStatus(${startId}, 2)`);
        }
    } else if (targetStatus === 2) { // 弃权
        row.classList.add('bg-red-50');
        if (nameSpan) nameSpan.classList.add('line-through', 'text-gray-400');
        if (tagAbsent) tagAbsent.classList.remove('hidden');
        if (btnPresent) {
            btnPresent.className = "btn-present w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base transition bg-white text-gray-300 border-gray-300 hover:border-emerald-500";
            btnPresent.setAttribute('onclick', `setCheckinStatus(${startId}, 1)`);
        }
        if (btnAbsent) {
            btnAbsent.className = "btn-absent w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base transition bg-red-600 text-white border-red-600 shadow-sm";
            btnAbsent.setAttribute('onclick', `setCheckinStatus(${startId}, 0)`); // 再次点击可取消
        }
    } else { // 恢复未检 (0)
        if (btnPresent) {
            btnPresent.className = "btn-present w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base transition bg-white text-gray-300 border-gray-300 hover:border-emerald-500";
            btnPresent.setAttribute('onclick', `setCheckinStatus(${startId}, 1)`);
        }
        if (btnAbsent) {
            btnAbsent.className = "btn-absent w-8 h-8 rounded-lg border flex items-center justify-center font-black text-base transition bg-white text-gray-300 border-gray-300 hover:border-red-500";
            btnAbsent.setAttribute('onclick', `setCheckinStatus(${startId}, 2)`);
        }
    }

    if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(30);
    }
    
    // 更新上级卡片统计
    updateHeatCardCheckinProgress(row);

    // 发起网络持久化请求
    fetch('/api/toggle_checkin', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id: startId, checked_in: targetStatus })
    })
    .then(r => r.json())
    .then(res => {
        if (res.status !== 'success') {
            alert("检录状态同步失败：" + (res.msg || ""));
            loadCheckinSchedule();
        }
    })
    .catch(() => {
        alert("网络连接异常，状态未能保存！");
        loadCheckinSchedule();
    });
}
window.isTrackBusy = false;

function pushHeatToFinish(gName, eName, gen, heat, btn, isRepush = false) {
    const tipText = isRepush 
        ? `确定要向终点【重新发送】(${gName} ${gen}·${eName} 第${heat}组) 的发令通知吗？`
        : `确认要推送【${gName} ${gen}·${eName} 第${heat}组】上道发令吗？`;
    if (!confirm(tipText)) return;

    btn.disabled = true;
    btn.innerHTML = `<span>⏳</span><span>推送中...</span>`;

    fetch('/api/push_active_heat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ group_name: gName, event_name: eName, gender: gen, heat: heat, force: isRepush })
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === 'success') {
            btn.disabled = false;
            btn.innerHTML = `<span>🏁</span><span>已发令</span>`;
            loadCheckinSchedule();
        } else {
            alert(res.msg || "发令失败");
            btn.disabled = false;
            btn.innerHTML = `<span>🚀</span><span>发令推送</span>`;
        }
    })
    .catch(err => {
        btn.disabled = false;
        btn.innerHTML = `<span>🚀</span><span>发令推送</span>`;
        alert("网络异常，未能成功通知终点！");
    });
}

function playStartBeep() {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
    } catch (e) {}
}

let lastNotifiedHeatKey = null;

function pollActiveHeat() {
    if (currentRole !== 'timing') return;

    fetch('/api/get_active_heat?_t=' + Date.now())
        .then(r => r.json())
        .then(res => {
            if (res.status === 'success' && res.data) {
                currentActiveHeatData = res.data;

                const notice = document.getElementById('trackActiveNotice');
                const info = document.getElementById('activeTrackInfo');
                const timeEl = document.getElementById('activeTrackTime');
                if (notice) notice.classList.remove('hidden');
                if (info) info.innerText = `${res.data.group_name} ${res.data.gender}子 · ${res.data.event_name} (第 ${res.data.heat} 组)`;
                if (timeEl) timeEl.innerText = `${res.data.push_time} 起点发令`;

                const currentHeatKey = `${res.data.group_name}_${res.data.event_name}_${res.data.gender}_${res.data.heat}_${res.data.push_time}`;
                if (currentHeatKey !== lastNotifiedHeatKey && !res.is_finished) {
                    lastNotifiedHeatKey = currentHeatKey;
                    if (currentRole === 'timing') {
                        playStartBeep();
                        if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([200, 100, 200]);
                        const modal = document.getElementById('newHeatModal');
                        document.getElementById('modalHeatInfo').innerText = `${res.data.group_name} ${res.data.gender}组 · ${res.data.event_name} (第 ${res.data.heat} 组)`;
                        document.getElementById('modalHeatTime').innerText = `发令时刻：${res.data.push_time}`;
                        if (modal) modal.classList.remove('hidden');
                    }
                }
            }
        })
        .catch(() => {});
}
window.acceptNewHeatAndLoad = function() {
