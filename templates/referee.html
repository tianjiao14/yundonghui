function switchToActiveHeat() {
    if (!currentActiveHeatData) return;
    const { group_name, event_name, gender, heat } = currentActiveHeatData;
    const controlBar = document.getElementById('fieldControlBar');
    if (controlBar) controlBar.classList.add('hidden');
    const highJumpPanel = document.getElementById('highJumpSection');
    if (highJumpPanel) highJumpPanel.classList.add('hidden');
    const normalTable = document.getElementById('normalTableSection');
    if (normalTable) normalTable.classList.remove('hidden');

    let cleanGender = gender.includes('女') ? '女' : '男';

    const selGroup = document.getElementById('selGroup');
    const selGender = document.getElementById('selGender');
    const selEvent = document.getElementById('selEvent');
    if (selGroup) selGroup.value = group_name;
    if (selGender) selGender.value = cleanGender;
    if (selEvent) selEvent.value = event_name;

    const list = document.getElementById('athleteList');
    list.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-blue-500 font-bold animate-pulse">正在载入已发令道次...</td></tr>';

    fetch('/api/get_event_start_list?_t=' + Date.now(), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ event_name: event_name, group_name: group_name, gender: cleanGender })
    })
    .then(r => r.json())
    .then(data => {
        if (!data || data.length === 0) {
            list.innerHTML = `<tr><td colspan="4" class="p-12 text-center text-gray-400 font-bold">未找到【${group_name} ${cleanGender}子 ${event_name}】的编排名单</td></tr>`;
            return;
        }
        let heatAthletes = data.filter(p => String(p.heat) === String(heat));
        if (heatAthletes.length === 0) heatAthletes = data;
        heatAthletes = heatAthletes.map(p => ({ ...p, score: (p.score !== undefined && p.score !== null) ? p.score : '' }));
        renderNormalTrackList(heatAthletes);
    })
    .catch(err => {
        list.innerHTML = '<tr><td colspan="4" class="p-12 text-center text-red-500 font-bold">加载名单失败，请检查网络后重试</td></tr>';
    });
}

// 🌟 趣味/游园项目专属：将所有无成绩选手一键标记弃权
window.batchMarkUnfinishedAsAbsent = function() {
    const gName = document.getElementById('selGroup')?.value || '';
    const gender = document.getElementById('selGender')?.value || '';
    const eName = document.getElementById('selEvent')?.value || '';

    if (!gName || !gender || !eName) {
        return alert("请先选择具体的组别、性别和项目！");
    }

    // 1. 针对田赛/多次试跳模式 (fieldAthletesData)
    if (fieldAthletesData && fieldAthletesData.length > 0 && !document.getElementById('fieldControlBar').classList.contains('hidden')) {
        let unscoredAthletes = fieldAthletesData.filter(a => {
            const atts = a.attempts || [];
            const hasAnyScore = atts.some(v => v && String(v).trim() !== '' && !String(v).includes('弃权'));
            const isAlreadyAbsent = atts.some(v => String(v).includes('弃权'));
            return !hasAnyScore && !isAlreadyAbsent;
        });

        if (unscoredAthletes.length === 0) {
            return alert("当前项目所有选手均已录入有效成绩或已标记弃权，无需批量处理！");
        }

        if (!confirm(`⚠️ 游园会批量判定提示：\n\n当前检测到【${unscoredAthletes.length} 名】选手没有任何测试成绩。\n是否将这 ${unscoredAthletes.length} 名未参赛选手一键判定为【弃权】？\n\n（已录入成绩的选手不受任何影响）`)) {
            return;
        }

        unscoredAthletes.forEach(a => {
            if (!a.attempts) a.attempts = ['', '', '', '', '', ''];
            a.attempts[0] = '弃权';
            a.score = '弃权';
        });

        // 刷新当前轮次显示
        renderCurrentFieldList();

        // 统一提交后台
        finalizeFieldCompetition();
        return;
    }

    // 2. 针对普通列表展示模式 (表格列表)
    const inputs = Array.from(document.querySelectorAll('#athleteList .input-score'));
    let blankInputs = inputs.filter(inp => {
        const val = String(inp.value || '').trim();
        return val === '' || val === '-';
    });

    if (blankInputs.length === 0) {
        return alert("当前项目所有选手均已录入成绩或已判定弃权！");
    }

    if (!confirm(`⚠️ 游园会批量判定提示：\n\n当前检测到【${blankInputs.length} 名】选手未录入成绩。\n确定将这些未到场选手一键全部标记为【弃权】吗？\n\n（已有有效成绩的选手不会被修改）`)) {
        return;
    }

    showTip("⏳ 正在批量提交弃权名单...", "text-blue-600");

    fetch('/api/batch_mark_absent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            group_name: gName,
            gender: gender,
            event_name: eName
        })
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === 'success') {
            if (typeof triggerVibrate === 'function') triggerVibrate([50, 50, 50]);
            alert(`🎉 ${res.msg}`);
            // 重新刷新当前界面列表
            loadAthletes();
        } else {
            alert("❌ 操作失败: " + res.msg);
        }
    })
    .catch(() => {
        alert("网络通信异常，请重试！");
    });
};

// 🌟 彻底补全：输入成绩回车自动跳转下一道
document.addEventListener('DOMContentLoaded', function() {
    const listContainer = document.getElementById('athleteList');
    if (!listContainer) return;

    listContainer.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
            const currentInput = e.target;
            if (!currentInput.classList.contains('input-score')) return;

            // 🌟 如果是田赛输入框，已由 handleFieldInputKeydown 专门处理，跳过全局事件
            if (currentInput.classList.contains('field-score-input')) return;

            e.preventDefault();
            currentInput.blur();
            const allInputs = Array.from(listContainer.querySelectorAll('.input-score:not([disabled])'));
            const currentIndex = allInputs.indexOf(currentInput);

            if (currentIndex >= 0 && currentIndex < allInputs.length - 1) {
                const nextInput = allInputs[currentIndex + 1];
                nextInput.focus();
                nextInput.select();
                nextInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    });
});
