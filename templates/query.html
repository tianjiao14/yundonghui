<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        
        /* 经典奥赛蓝主题 */
        .portal-header { background-color: #004b87; color: white; }
        .acc-header { background-color: #eaf2f8; color: #1e3a8a; border-bottom: 1px solid #c8d9ea; border-top: 1px solid #c8d9ea; }
        .acc-header:active { background-color: #dbeafe; }
        
        /* 虚线与实线经典表格 */
        .classic-dashed-table th { border-bottom: 2px solid #d1d5db; }
        .classic-dashed-table tr { border-bottom: 1px dashed #9ca3af; }
        .classic-dashed-table tr:nth-child(even) { background-color: #f3f6f9; }

        .team-header-bg { background-color: #6567ad; color: white; }
        .team-table-title { background-color: #8f8f8f; color: white; }
        .classic-solid-table th, .classic-solid-table td { border: 1px solid #737373; padding: 6px 4px; }
        .classic-solid-table tr:nth-child(even) { background-color: #f9fafb; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="max-w-lg mx-auto bg-white min-h-screen border-x border-gray-200 flex flex-col shadow-lg relative">

    <div id="view-home" class="view-panel flex flex-col flex-1">
        <header class="portal-header p-3 text-center sticky top-0 z-20">
            <h1 class="text-[15px] font-bold" id="sysTitle">{{ title }}</h1>
        </header>

        <main class="flex-1 flex flex-col no-scrollbar overflow-y-auto pb-6">
            <div class="accordion-item">
                <button class="acc-header w-full flex justify-between items-center p-3 text-sm font-bold transition-colors" onclick="toggleAcc('panel-results')">
                    <span>1. 成绩公告 (各小组及综合成绩)</span>
                </button>
                <div id="panel-results" class="hidden bg-white">
                    <ul class="divide-y divide-gray-100 text-[13px]" id="resultList"></ul>
                </div>
            </div>

            <div class="accordion-item">
                <button class="acc-header w-full flex justify-between items-center p-3 text-sm font-bold transition-colors mt-[-1px]" onclick="toggleAcc('panel-startlist')">
                    <span>2. 后续参赛名单 (决赛出线)</span>
                </button>
                <div id="panel-startlist" class="hidden bg-white">
                    <ul class="divide-y divide-gray-100 text-[13px]" id="startList"></ul>
                </div>
            </div>

            <div class="accordion-item">
                <button class="acc-header w-full flex justify-between items-center p-3 text-sm font-bold transition-colors mt-[-1px]" onclick="toggleAcc('panel-team-score')">
                    <span>3. 团体总分排名</span>
                </button>
                <div id="panel-team-score" class="hidden bg-white p-2">
                    <div class="flex justify-between items-center mb-2 px-1 mt-2">
                        <select id="rankGroupSelect" onchange="loadTeamRank()" class="border border-blue-300 rounded p-1 text-xs text-blue-800 bg-blue-50 outline-none">
                            <option value="">-- 选择组别 --</option>
                        </select>
                        <span class="text-[10px] text-gray-400" id="rankTime"></span>
                    </div>
                    <table class="w-full text-center text-[12px] border-collapse border border-gray-200">
                        <thead class="bg-[#f0f5fa] text-gray-600 border-b border-gray-300">
                            <tr>
                                <th class="p-2 border-r border-gray-200 w-10">No</th>
                                <th class="p-2 border-r border-gray-200 text-left">单位</th>
                                <th class="p-2 border-r border-gray-200 text-blue-700">总分</th>
                                <th class="p-2 border-r border-gray-200">金</th>
                                <th class="p-2 border-r border-gray-200">银</th>
                                <th class="p-2 border-r border-gray-200">铜</th>
                                <th class="p-2 border-r border-gray-200 text-red-600">破纪分</th>
                                <th class="p-2 border-r border-gray-200 text-blue-700">总分</th>
                            </tr>
                        </thead>
                        <tbody id="rankTableBody" class="divide-y divide-gray-200">
                            <tr><td colspan="6" class="p-4 text-gray-400">请选择组别查看</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="accordion-item">
                <button class="acc-header w-full flex justify-between items-center p-3 text-sm font-bold transition-colors mt-[-1px]" onclick="toggleAcc('panel-search')">
                    <span>4. 查询（运动员报名及成绩）</span>
                </button>
                <div id="panel-search" class="hidden bg-[#eaf2f8] p-4 border-b border-gray-200">
                    <div class="flex gap-2">
                        <select class="border border-gray-300 rounded p-2 text-sm bg-white" id="searchType">
                            <option value="athlete">运动员</option>
                            <option value="team">代表队</option>
                        </select>
                        <input type="text" id="searchInput" placeholder="输入姓名/号码/队名" class="flex-1 border border-gray-300 rounded p-2 text-sm outline-none focus:border-blue-500">
                        <button onclick="executeSearch()" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded text-sm active:bg-gray-100">查</button>
                    </div>
                    <div id="searchResultArea" class="mt-4 bg-white rounded shadow-sm overflow-hidden hidden divide-y"></div>
                </div>
            </div>
        </main>

        <footer class="portal-header p-3 text-center text-[10px] space-y-1 mt-auto">
            <div id="sysDate">----年--月--日</div>
            <div>《田径运动会管理系统》 信息发布</div>
        </footer>
    </div>

    <div id="view-event-detail" class="view-panel flex flex-col flex-1 hidden bg-white">
        <header class="portal-header p-3 text-white sticky top-0 z-10 flex justify-between items-center">
            <div>
                <div class="text-[11px] text-blue-100 mb-0.5">竞赛信息</div>
                <div class="text-[16px] font-bold tracking-wide" id="detEventName">--</div>
            </div>
            <button onclick="switchView('view-home')" class="text-xs bg-black/20 hover:bg-black/30 px-2.5 py-1.5 rounded border border-white/20 active:scale-95">返回</button>
        </header>
        <div class="bg-[#eaf2f8] px-3 py-1.5 flex justify-between items-center text-[13px] font-bold text-[#004b87] border-t border-gray-300 border-b-2 border-[#b5c7d8]">
            <span id="detHeatLabel">数据同步中...</span>
        </div>
        <div class="w-full overflow-y-auto flex-1 no-scrollbar bg-gray-50 pb-8" id="detContentArea"></div>
    </div>

    <div id="view-athlete-detail" class="view-panel flex flex-col flex-1 hidden bg-white">
        <header class="bg-[#1e3a8a] p-3 text-white sticky top-0 z-10 flex justify-between items-center">
            <div>
                <div class="text-[11px] text-blue-200 mb-0.5">运动员成绩册</div>
                <h1 class="text-[16px] font-bold" id="athDetailName">--</h1>
            </div>
            <button onclick="switchView('view-home')" class="text-xs bg-black/20 hover:bg-black/30 px-2.5 py-1.5 rounded active:scale-95">返回</button>
        </header>
        <div class="bg-gray-100 p-3 text-[12px] text-gray-600 grid grid-cols-2 gap-2 border-b">
            <div>代表单位：<span id="athDetailTeam" class="font-bold text-gray-900">--</span></div>
            <div>参赛号码：<span id="athDetailBib" class="font-mono font-bold text-gray-900">--</span></div>
        </div>
        <div class="w-full overflow-y-auto flex-1 no-scrollbar">
            <table class="w-full text-center text-[13px] classic-solid-table border-collapse">
                <thead class="bg-gray-800 text-white font-bold text-[13px]">
                    <tr>
                        <th class="py-2 text-left pl-2">参赛项目</th>
                        <th class="py-2 w-24">项目成绩</th>
                        <th class="py-2 w-16">最终名次</th>
                    </tr>
                </thead>
                <tbody id="athTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="view-team-detail" class="view-panel flex flex-col flex-1 hidden bg-white">
        <header class="team-header-bg p-3 text-white sticky top-0 z-10 flex justify-between items-center">
            <h1 class="text-[15px] font-bold tracking-wide truncate max-w-[80%]" id="teamDetailTitle">--</h1>
            <button onclick="switchView('view-home')" class="text-xs bg-black/20 hover:bg-black/30 px-2.5 py-1.5 rounded active:scale-95 shrink-0">返回</button>
        </header>
        <div class="px-2 py-1.5 text-right text-[12px] font-bold text-black border-b-2 border-gray-400 bg-white">
            截至：<span id="teamCutoffTime">--</span>
        </div>
        <div class="w-full overflow-y-auto flex-1 no-scrollbar">
            <table class="w-full text-center text-[13px] classic-solid-table border-collapse">
                <thead class="team-table-title font-bold text-[13px]">
                    <!-- 👇 修改了这里的表头结构 -->
                    <tr>
                        <th class="py-2 px-2 text-left pl-2">项目 (性别)</th>
                        <th class="py-2 px-1 w-16">姓名</th>
                        <th class="py-2 px-1 w-20 text-right pr-2">成绩</th>
                        <th class="py-2 px-1 w-12 text-center">名次</th>
                        <th class="py-2 px-1 w-12 text-center">得分</th>
                    </tr>
                </thead>
                <tbody id="teamTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let db = { groups: [], events: [], teams: [], athletes: [], schedule: [] };

        window.onload = () => {
            const d = new Date();
            document.getElementById('sysDate').innerText = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
            
            fetch('/api/get_data').then(r => r.json()).then(data => {
                db.groups = data.groups || [];
                db.teams = data.teams || [];
                db.athletes = data.athletes || [];
                db.events = data.events || [];
                db.schedule = data.schedule || []; 
                
                if(data.config && data.config.title) document.getElementById('sysTitle').innerText = data.config.title;
                
                const rankSel = document.getElementById('rankGroupSelect');
                rankSel.innerHTML = '<option value="">-- 选择组别 --</option>';
                db.groups.forEach(g => { rankSel.innerHTML += `<option value="${g.name}">${g.name}</option>`; });
                
                renderRealAnnouncements();
                renderSubsequentStartLists();
            }).catch(e => console.error("数据连接异常:", e));
        };

        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function toggleAcc(panelId) { document.getElementById(panelId).classList.toggle('hidden'); }

        function parseTimeVal(val) {
            if (!val) return 0;
            let s = String(val).trim().replace('：', ':').replace('。', '.');
            if (s.includes(':')) {
                let parts = s.split(':');
                if (parts.length === 2) return parseInt(parts[0]) * 60 + parseFloat(parts[1]);
                if (parts.length === 3) return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseFloat(parts[2]);
            }
            return parseFloat(s) || 0;
        }

        // ==========================================
        // 1. 成绩公告列表
        // ==========================================
        function renderRealAnnouncements() {
            const list = document.getElementById('resultList');
            if(!db.schedule.length) {
                list.innerHTML = '<li class="p-3 text-center text-gray-400">尚未生成赛程数据</li>'; return;
            }
            const eventNames = [...new Set(db.schedule.map(s => s.eventName))].sort();
            list.innerHTML = eventNames.map(eName => `
                <li class="p-3 flex justify-between items-center hover:bg-blue-50 active:bg-blue-100 cursor-pointer border-b border-gray-100" 
                    onclick="goToEventDetail('${eName}', false)">
                    <span class="text-blue-800 font-bold text-sm">🏁 ${eName}</span>
                    <span class="text-gray-400 text-xs">查看各组及总成绩 ➔</span>
                </li>
            `).join('');
        }

        // ==========================================
        // 2. 后续参赛名单列表
        // ==========================================
        function renderSubsequentStartLists() {
            const list = document.getElementById('startList');
            if(!db.schedule.length) return;
            const finalEvents = [...new Set(db.schedule.filter(s => s.eventName.includes('决赛')).map(s => s.eventName))].sort();
            if(finalEvents.length === 0) {
                list.innerHTML = '<li class="p-3 text-center text-gray-400">暂无产生后续赛次决赛的项目</li>'; return;
            }
            list.innerHTML = finalEvents.map(eName => `
                <li class="p-3 flex justify-between items-center hover:bg-purple-50 active:bg-purple-100 cursor-pointer border-b border-gray-100" 
                    onclick="goToEventDetail('${eName}', true)">
                    <span class="text-purple-900 font-bold text-sm">🏆 ${eName} </span>
                    <span class="text-xs text-purple-500 font-bold">查看出线大名单 ➔</span>
                </li>
            `).join('');
        }

        // ==========================================
        // 核心：一键渲染【各小组成绩】+【最后综合成绩】
        // 包含：动态多级纪录比对与破纪代码(XR/SR)自动加注
        // ==========================================
        function goToEventDetail(eventName, isFinalsList) {
            document.getElementById('detEventName').innerText = eventName;
            document.getElementById('detHeatLabel').innerText = isFinalsList ? '晋级决赛检录名单' : '综合成绩公告';
            const contentArea = document.getElementById('detContentArea');
            contentArea.innerHTML = '<div class="p-10 text-center text-gray-400 font-bold">正在同步成绩矩阵与纪录档案...</div>';
            switchView('view-event-detail');

            let coreMatchName = eventName.replace('决赛', '').replace('预赛', '').replace('()', '').replace('（）', '').trim();
            if (coreMatchName.startsWith('女') && !coreMatchName.startsWith('女子')) coreMatchName = coreMatchName.replace('女', '女子');
            if (coreMatchName.startsWith('男') && !coreMatchName.startsWith('男子')) coreMatchName = coreMatchName.replace('男', '男子');
            
            const evtCfg = db.events.find(e => e.name === coreMatchName || e.name === eventName);
            let roundStatus = "决赛";
            if (eventName.includes('预赛')) roundStatus = "预赛";
            else if (eventName.includes('决赛')) roundStatus = "决赛";
            else roundStatus = (evtCfg && (String(evtCfg.hasPrelim) === 'true' || String(evtCfg.has_prelim) === '1')) ? "预赛" : "决赛";

            const qualifyLimit = evtCfg ? (parseInt(evtCfg.limit) || parseInt(evtCfg.limit_count) || 8) : 8;

            fetch('/api/get_event_start_list', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ event_name: eventName }) 
            })
            .then(r => r.json())
            .then(data => {
                if(data.length === 0) {
                    contentArea.innerHTML = '<div class="p-8 text-center text-gray-400">该项目暂无编排数据</div>'; return;
                }

                // 🌟 核心突破：并发拉取该页面涉及到的【所有组别】的独立纪录设定
                const uniqueGroups = [...new Set(data.map(i => i.group_name).filter(Boolean))];
                Promise.all(uniqueGroups.map(g => 
                    fetch('/api/get_group_records', {
                        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ group_name: g })
                    }).then(res => res.json()).then(recs => ({ group: g, records: recs }))
                )).then(recordResults => {
                    
                    // 将拉取到的纪录汇编成本地字典库
                    const globalRecordMap = {};
                    recordResults.forEach(rr => { globalRecordMap[rr.group] = rr.records; });

                    const isField = eventName.includes('跳') || eventName.includes('投') || eventName.includes('球') || eventName.includes('掷');

                    // 🎯 辅助函数：根据具体成绩和组别自动判定是否产生破纪录代码徽章
                    function getRecordBadge(scoreStr, groupName, gender) {
                        const scoreVal = parseTimeVal(scoreStr);
                        if (scoreVal <= 0) return '';
                        
                        const groupRecs = globalRecordMap[groupName] || {};
                        const myRecords = (groupRecs[`${coreMatchName}_${gender}`] || []).filter(r => r.en && parseTimeVal(r.val) > 0);
                        
                        let brokenCode = '';
                        let maxBonus = -1; // 用以应对加分为0但也需要挂徽章的情况
                        
                        myRecords.forEach(rec => {
                            const recVal = parseTimeVal(rec.val);
                            const isBroken = isField ? (scoreVal > recVal) : (scoreVal < recVal);
                            if (isBroken && rec.bonus >= maxBonus) {
                                maxBonus = rec.bonus;
                                brokenCode = rec.code || 'XR'; // 兜底默认代码
                            }
                        });
                        
                        if (brokenCode) {
                            return `<span class="text-[9px] bg-red-600 text-white px-1 py-0.5 rounded font-black shadow-sm tracking-wider">${brokenCode}</span>`;
                        }
                        return '';
                    }

                    const grouped = {};
                    data.forEach(item => {
                        const key = `${item.group_name} (${item.gender})`;
                        if(!grouped[key]) grouped[key] = [];
                        grouped[key].push(item);
                    });

                    let html = '';

                    Object.keys(grouped).sort().forEach((groupKey, gIndex) => {
                        const groupData = grouped[groupKey];
                        const contentId = `grp_content_${gIndex}`;
                        const currentGroupName = groupData[0].group_name;
                        const currentGender = groupData[0].gender;

                        html += `
                        <div class="bg-[#dbeafe] px-4 py-3 font-black text-[#1e3a8a] border-y-2 border-[#93c5fd] mt-4 shadow-sm flex justify-between items-center cursor-pointer active:bg-blue-200 transition" onclick="document.getElementById('${contentId}').classList.toggle('hidden')">
                            <span>🔹 组别：${groupKey}</span>
                            <span class="text-blue-600 text-xs bg-blue-100 px-2 py-1 rounded shadow-sm">点击展开/折叠 ▼</span>
                        </div>
                        <div id="${contentId}" class="hidden transition-all duration-300">`;

                        if (isFinalsList) {
                            const heats = {};
                            groupData.forEach(i => { const h = i.heat || '1'; if(!heats[h]) heats[h] = []; heats[h].push(i); });
                            
                            Object.keys(heats).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(h => {
                                html += `<div class="px-3 py-1.5 text-xs font-bold text-gray-600 bg-white border-b">🚩 第 ${h} 组 (决赛)</div>`;
                                html += `<table class="w-full text-center text-[13px] classic-dashed-table border-collapse bg-white mb-2">
                                    <thead class="text-gray-500 bg-[#f8fafc]"><tr><th class="py-1.5 w-12 border-r">道次</th><th class="w-16 border-r">号码</th><th class="text-left pl-2">姓名</th><th class="text-left pl-2">单位</th></tr></thead>
                                    <tbody>`;
                                const heatItems = heats[h].sort((a,b) => parseInt(a.lane) - parseInt(b.lane));
                                heatItems.forEach(item => {
                                    html += `<tr>
                                        <td class="py-2 text-gray-500 font-bold border-r">${item.lane || '-'}</td>
                                        <td class="py-2 font-mono font-bold border-r">${item.bib || '---'}</td>
                                        <td class="py-2 text-left pl-2 font-bold text-blue-700 underline" onclick="goToAthleteDetail('${item.name}')">${item.name}</td>
                                        <td class="py-2 text-left pl-2 text-gray-600 truncate max-w-[120px]">${item.team_name}</td>
                                    </tr>`;
                                });
                                html += `</tbody></table>`;
                            });
                        } else {
                            const heats = {};
                            groupData.forEach(i => { const h = i.heat || '1'; if(!heats[h]) heats[h] = []; heats[h].push(i); });
                            
                            // 各小组成绩列表
                            Object.keys(heats).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(h => {
                                html += `<div class="px-3 py-1 text-[11px] font-bold text-gray-500 bg-gray-50 border-y border-gray-200">🚩 第 ${h} 小组成绩</div>`;
                                html += `<table class="w-full text-center text-[13px] classic-dashed-table border-collapse bg-white">
                                    <thead class="text-gray-400 bg-white"><tr><th class="py-1 w-10">道序</th><th class="w-16">号码</th><th class="text-left">姓名</th><th class="text-left">单位</th><th class="text-right pr-3">单组成绩</th></tr></thead>
                                    <tbody>`;
                                const heatItems = heats[h].sort((a,b) => parseInt(a.lane) - parseInt(b.lane));
                                heatItems.forEach(item => {
                                    const badge = getRecordBadge(item.score, currentGroupName, currentGender);
                                    html += `<tr>
                                        <td class="py-1.5 text-gray-400">${item.lane || '-'}</td>
                                        <td class="py-1.5 font-mono text-gray-400">${item.bib || '-'}</td>
                                        <td class="py-1.5 text-left font-bold" onclick="goToAthleteDetail('${item.name}')">${item.name}</td>
                                        <td class="py-1.5 text-left text-gray-500 truncate max-w-[100px]">${item.team_name}</td>
                                        <td class="py-1.5 text-right pr-3">
                                            <div class="flex items-center justify-end gap-1">
                                                <span class="font-mono font-bold text-gray-700">${item.score || '-'}</span>
                                                ${badge}
                                            </div>
                                        </td>
                                    </tr>`;
                                });
                                html += `</tbody></table>`;
                            });

                            const scored = groupData.filter(i => i.score && i.score.trim() !== '');
                            if (scored.length > 0) {
                                scored.sort((a,b) => {
                                    const sa = parseTimeVal(a.score); const sb = parseTimeVal(b.score);
                                    return isField ? (sb - sa) : (sa - sb);
                                });

                                html += `<div class="px-3 py-2 text-[14px] font-black text-red-800 bg-[#fef2f2] border-t-2 border-red-200 mt-2 flex items-center justify-center tracking-widest">🏆 最后综合成绩排名</div>`;
                                
                                let extraColName = roundStatus === '预赛' ? '录取' : '积分';

                                html += `<table class="w-full text-center text-[13px] classic-solid-table border-collapse bg-white mb-4">
                                    <thead class="text-white bg-[#8f8f8f]"><tr>
                                        <th class="py-1.5 w-10">名次</th>
                                        <th class="w-14">号码</th>
                                        <th class="text-left pl-2">姓名</th>
                                        <th class="text-left pl-2">单位</th>
                                        <th class="text-right pr-3 w-20">成绩</th>
                                        <th class="w-12">${extraColName}</th>
                                    </tr></thead>
                                    <tbody>`;
                                
                                let currentRank = 1;
                                scored.forEach((item, idx) => {
                                    if (idx > 0 && parseTimeVal(item.score) !== parseTimeVal(scored[idx-1].score)) currentRank = idx + 1;
                                    
                                    const badge = getRecordBadge(item.score, currentGroupName, currentGender);

                                    let extraColHtml = '';
                                    if (roundStatus === '预赛') {
                                        if (currentRank <= qualifyLimit) {
                                            extraColHtml = '<span class="font-bold text-black text-[16px] font-mono">q</span>';
                                        }
                                    } else {
                                        // 决赛阶段：从后端提取已计算好的积分（包含纪录分加成）
                                        let pts = item.points || 0;
                                        if (pts > 0) extraColHtml = `<span class="font-bold text-orange-600">${pts}</span>`;
                                    }

                                    html += `<tr>
                                        <td class="py-2 font-black text-red-600 bg-red-50">${currentRank}</td>
                                        <td class="py-2 font-mono text-gray-600">${item.bib || '-'}</td>
                                        <td class="py-2 text-left pl-2 font-bold text-blue-700 underline" onclick="goToAthleteDetail('${item.name}')">${item.name}</td>
                                        <td class="py-2 text-left pl-2 text-gray-800 truncate max-w-[90px]">${item.team_name}</td>
                                        <td class="py-2 bg-red-50 text-right pr-3">
                                            <div class="flex items-center justify-end gap-1">
                                                <span class="font-mono font-black text-red-600">${item.score}</span>
                                                ${badge}
                                            </div>
                                        </td>
                                        <td class="py-2 bg-red-50 text-center">${extraColHtml}</td>
                                    </tr>`;
                                });
                                html += `</tbody></table>`;
                            } else {
                                html += `<div class="px-3 py-4 text-xs text-center text-gray-400 bg-white border-t border-gray-100">本组暂无裁判录入成绩，请等待比赛结束</div>`;
                            }
                        }
                        html += `</div>`; 
                    });
                    contentArea.innerHTML = html;
                });
            });
        }

        // ==========================================
        // 3. 团体总分
        // ==========================================
        function loadTeamRank() {
            const gName = document.getElementById('rankGroupSelect').value;
            const tbody = document.getElementById('rankTableBody');
            if(!gName) return;

            tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-400">正在极速核算纯净总分...</td></tr>';
            
            fetch('/api/calculate_team_ranking', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ group_name: gName })
            })
            .then(r => r.json())
            .then(data => {
                const d = new Date();
                document.getElementById('rankTime').innerText = `更新时间: ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;

                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-gray-400">该组别暂无队伍获得决赛积分</td></tr>'; return;
                }

                tbody.innerHTML = data.map((t, i) => `
                    <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-[#f9fbfd]'} h-10">
                        <td class="p-2 border-r border-gray-200 text-gray-500 font-bold">${i===0?'🥇':(i===1?'🥈':(i===2?'🥉':i+1))}</td>
                        <td class="p-2 border-r border-gray-200 text-left font-bold text-gray-800">${t.name}</td>
                        <td class="p-2 border-r border-gray-200 font-black text-blue-700 text-[15px] underline cursor-pointer" onclick="goToTeamDetail('${t.name}', '${gName}')">${t.score}</td>
                        <td class="p-2 border-r border-gray-200 text-yellow-600 font-bold">${t.gold}</td>
                        <td class="p-2 border-r border-gray-200 text-gray-500 font-bold">${t.silver}</td>
                        <td class="p-2 text-orange-600 font-bold border-r border-gray-200">${t.bronze}</td>
<td class="p-2 border-r border-gray-200 text-red-500 font-bold bg-red-50">+${t.total_record_bonus || 0}</td>
<td class="p-2 font-black text-blue-700 text-[15px] underline cursor-pointer" onclick="..."> ${t.score}</td>
                    </tr>
                `).join('');
            });
        }

        // 班级积分贡献明细
        // 班级积分贡献明细 (穿透至个人名次与成绩)
        function goToTeamDetail(teamName, groupName) {
            document.getElementById('teamDetailTitle').innerText = `${teamName} 积分贡献明细`;
            const d = new Date(); document.getElementById('teamCutoffTime').innerText = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
            
            const tbody = document.getElementById('teamTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-gray-400">正在提取详细得分数据...</td></tr>';
            switchView('view-team-detail');

            // 🚀 调用刚刚在 app.py 里写好的新接口
            fetch('/api/get_team_score_details', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ group_name: groupName, team_name: teamName })
            })
            .then(r => r.json())
            .then(data => {
                if(!data || data.length === 0) { 
                    tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-400">该班级暂无得分明细</td></tr>'; return; 
                }
                
                let html = '';
                data.forEach(row => {
                    // 智能识别接力项目
                    const isRelay = row.event_name.includes('接力') || row.event_name.includes('4×') || row.event_name.includes('4*');
                    const displayName = isRelay ? '集体项目' : row.name;

                    html += `<tr class="border-b border-gray-200 hover:bg-blue-50 transition">
                        <td class="py-2.5 px-2 text-left font-bold text-gray-700 border-r border-gray-100">${row.event_name} <span class="text-[10px] text-blue-500">(${row.gender})</span></td>
                        <td class="py-2.5 px-1 font-bold text-blue-700 border-r border-gray-100 ${!isRelay ? 'cursor-pointer underline' : ''}" ${!isRelay ? `onclick="goToAthleteDetail('${row.name}')"` : ''}>${displayName}</td>
                        <td class="py-2.5 px-1 text-right font-mono font-bold text-gray-800 border-r border-gray-100 pr-2">${row.score}</td>
                        <td class="py-2.5 px-1 text-center font-bold text-orange-600 border-r border-gray-100">${row.rank}</td>
                        <td class="py-2.5 px-1 text-center font-black text-red-600 bg-red-50/50">+${row.points}</td>
                    </tr>`;
                });
                tbody.innerHTML = html;
            }).catch(e => {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-red-500">数据提取失败，请检查网络连接</td></tr>';
            });
        }

        // ==========================================
        // 4. 查询及运动员成绩穿透
        // ==========================================
        function executeSearch() {
            const type = document.getElementById('searchType').value;
            const kw = document.getElementById('searchInput').value.trim().toLowerCase();
            const resArea = document.getElementById('searchResultArea');
            if(!kw) return alert("请输入检索内容");
            resArea.classList.remove('hidden');
            
            if (type === 'athlete') {
                const matched = db.athletes.filter(a => a.name.toLowerCase().includes(kw) || (a.bib && a.bib.includes(kw)));
                if(!matched.length) { resArea.innerHTML = '<div class="p-4 text-gray-400 text-center">未检索到运动员，请检查名字</div>'; return; }
                
                resArea.innerHTML = `<div class="p-2 bg-gray-50 text-xs text-gray-500 font-bold">检索到以下学生：</div>` + matched.map(a => {
                    const tName = db.teams.find(t => t.id == a.teamId)?.name || '--';
                    return `
                        <div class="p-3 text-sm flex justify-between items-center hover:bg-blue-50 border-b cursor-pointer" onclick="goToAthleteDetail('${a.name}')">
                            <span class="font-bold text-blue-700 underline">👤 ${a.name} (${a.gender})</span>
                            <span class="text-xs text-gray-500">${tName} | ${a.bib ? '号码:'+a.bib : '无号'}</span>
                        </div>
                    `;
                }).join('');
            } else {
                const matched = db.teams.filter(t => t.name.toLowerCase().includes(kw));
                if(!matched.length) { resArea.innerHTML = '<div class="p-4 text-gray-400 text-center">未检索到该代表队</div>'; return; }
                
                resArea.innerHTML = `<div class="p-2 bg-gray-50 text-xs text-gray-500 font-bold">检索到以下班级：</div>` + matched.map(t => {
                    const gName = db.groups.find(g => g.id == t.groupId || g.id == t.group_id)?.name || '--';
                    return `
                        <div class="p-3 text-sm flex justify-between items-center hover:bg-blue-50 border-b cursor-pointer" onclick="goToTeamDetail('${t.name}', '${gName}')">
                            <span class="font-bold text-gray-800">🏫 ${t.name}</span>
                            <span class="text-xs text-blue-500 font-bold">${gName} | 看积分 ➔</span>
                        </div>
                    `;
                }).join('');
            }
        }

        // 精确提取个人全科成绩
        function goToAthleteDetail(athleteName) {
            const ath = db.athletes.find(a => a.name === athleteName);
            if (!ath) return alert("数据异常");
            
            document.getElementById('athDetailName').innerText = `${ath.name} (${ath.gender})`;
            document.getElementById('athDetailBib').innerText = ath.bib || '--';
            document.getElementById('athDetailTeam').innerText = db.teams.find(t => t.id == ath.teamId)?.name || '--';
            
            const tbody = document.getElementById('athTableBody');
            tbody.innerHTML = '<tr><td colspan="3" class="p-10 text-center text-gray-400 font-bold">正在提取个人成绩档案...</td></tr>';
            switchView('view-athlete-detail');

            const team = db.teams.find(t => t.id == ath.teamId);
            const groupName = db.groups.find(g => g.id == team?.groupId || g.id == team?.group_id)?.name || '';

            const mySchedule = db.schedule.filter(s => s.name === athleteName && s.groupName === groupName);
            let myEventNames = [...new Set(mySchedule.map(s => s.eventName))];
            if(myEventNames.length === 0) myEventNames = ath.events; 

            const fetchPromises = myEventNames.map(evtName => {
                return fetch('/api/get_event_start_list', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ event_name: evtName, group_name: groupName, gender: ath.gender })
                })
                .then(r => r.json())
                .then(startList => {
                    const isField = evtName.includes('跳') || evtName.includes('投') || evtName.includes('球') || evtName.includes('掷');
                    const scored = startList.filter(i => i.score && i.score.trim() !== '');
                    scored.sort((a,b) => { const sa = parseTimeVal(a.score); const sb = parseTimeVal(b.score); return isField ? (sb - sa) : (sa - sb); });
                    
                    const myItem = startList.find(i => i.name === athleteName);
                    
                    let rankDisplay = '--';
                    if (myItem && myItem.score) {
                        let rankIdx = 1;
                        for (let i = 0; i < scored.length; i++) {
                            if (i > 0 && parseTimeVal(scored[i].score) !== parseTimeVal(scored[i-1].score)) rankIdx = i + 1;
                            if (scored[i].name === athleteName) { rankDisplay = rankIdx; break; }
                        }
                    }
                    return { event: evtName, score: myItem?.score || '未出成绩', rank: rankDisplay };
                }).catch(() => ({ event: evtName, score: '网络异常', rank: '--' }));
            });

            Promise.all(fetchPromises).then(results => {
                if (results.length === 0) { tbody.innerHTML = '<tr><td colspan="3" class="p-6 text-center text-gray-400">暂无参赛项目</td></tr>'; return; }
                tbody.innerHTML = results.map(r => `
                    <tr class="border-b border-gray-200 hover:bg-gray-100">
                        <td class="py-3 px-2 text-left text-blue-900 font-bold">${r.event}</td>
                        <td class="py-3 px-2 font-mono font-bold ${r.score.includes('未出') ? 'text-gray-400 font-normal' : 'text-red-600'}">${r.score}</td>
                        <td class="py-3 px-2 text-center font-bold text-orange-600 text-[15px]">${r.rank}</td>
                    </tr>
                `).join('');
            });
        }
    </script>
</body>
